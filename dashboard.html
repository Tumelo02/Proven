<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Proven</title>
<link rel="icon" type="image/png" href="assets/logo_only__1_-removebg-preview.png" />
<style>
  :root {
    --navy: #0a2540; --navy-2: #123a63; --navy-3: #1d5490;
    /* Brand accent, drawn from the logo's cyan but darkened to pass contrast on
       white. Kept distinct from --red so brand styling never reads as an alarm. */
    --accent: #0b7c8c; --accent-soft: #e4f6f9;
    --accent-ink: #096975; /* darker teal for small text on --accent-soft (5.7:1) */
    --cyan: #22dff5; /* raw logo cyan, large shapes on navy only, fails contrast on white */
    --bg: #eef2f8; --card: #ffffff; --ink: #0a2540;
    --muted: #5d6f88; --faint: #8b9bb0;
    --green: #12805c; --green-soft: #e3f6ee;
    --yellow: #a86a00; --yellow-soft: #fdf1dc;
    --red: #c0322b; --red-soft: #fdeae8;
    --blue: #1d5490; --blue-soft: #e6eefb;
    --grey: #5d6f88; --grey-soft: #eef1f6;
    --line: #dde5f0; --line-2: #eaeff6;
    --shadow: 0 1px 2px rgba(10,37,64,.06), 0 8px 24px rgba(10,37,64,.08);
    --shadow-lg: 0 2px 4px rgba(10,37,64,.06), 0 16px 40px rgba(10,37,64,.12);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: "Inter", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,h4 { margin: 0; font-weight: 750; letter-spacing: -0.01em; }
  p { margin: 0; }
  button { font-family: inherit; }
  a { color: inherit; }

  /* ---------- Landing / Journey ---------- */
  /* Sized to fit a standard viewport without scrolling: the column is centred in
     the leftover space and every vertical gap is clamped against viewport height. */
  .landing {
    min-height: 100vh; background: var(--navy); color: #fff; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    padding: 16px 24px clamp(18px, 3vh, 32px); position: relative;
  }
  .landing .mark { margin-bottom: clamp(6px, 1.2vh, 12px); }
  /* Halo keeps the dark leaf readable against the navy landing background. */
  .landing .mark img {
    display: block; height: clamp(46px, 7vh, 66px); width: auto;
    filter: drop-shadow(0 0 1px rgba(255,255,255,.5)) drop-shadow(0 0 9px rgba(34,223,245,.22));
  }
  .landing .brandname { font-size: clamp(18px, 2.4vh, 22px); font-weight: 800; letter-spacing: .08em; color: #fff; }
  .landing .brandtag { font-size: clamp(10.5px, 1.5vh, 12.5px); font-weight: 700; letter-spacing: .05em; color: var(--cyan); text-transform: uppercase; margin-top: 3px; margin-bottom: clamp(10px, 1.8vh, 18px); }
  .landing h1 { font-size: clamp(24px, 3.8vh, 34px); text-align: center; max-width: 720px; line-height: 1.18; }
  .landing .tagline { color: #b9cbe0; font-size: clamp(13.5px, 1.9vh, 16px); text-align: center; max-width: 620px; margin-top: clamp(8px, 1.5vh, 16px); line-height: 1.5; }
  .landing .twosided-line { color: #9fb6d1; font-size: clamp(12px, 1.6vh, 13.5px); font-weight: 700; text-align: center; margin-top: clamp(12px, 2.2vh, 24px); }
  .journey { display: flex; gap: 0; margin: clamp(20px, 3.6vh, 46px) 0 4px; max-width: 1040px; width: 100%; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  .journey .step { display: flex; flex-direction: column; align-items: center; width: 116px; text-align: center; position: relative; }
  .journey .step .dot {
    position: relative; width: 46px; height: 46px; border-radius: 50%;
    background: rgba(255,255,255,.07); border: 1.5px solid rgba(255,255,255,.28);
    display: grid; place-items: center; color: var(--cyan);
  }
  .journey .step .dot .ico { width: 22px; height: 22px; display: block; }
  /* Small ordinal badge keeps the sequence readable now the circle holds an icon. */
  .journey .step .dot .no {
    position: absolute; top: -3px; right: -3px; width: 17px; height: 17px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 9.5px; font-weight: 800;
    display: grid; place-items: center; border: 1.5px solid var(--navy); letter-spacing: 0;
  }
  .journey .step .lbl { font-size: 11.5px; font-weight: 700; margin-top: 11px; color: #cbd8e8; line-height: 1.3; }

  /* ---- Per-step hover behaviour ------------------------------------------
     Each step animates in the way its own idea behaves: the eye blinks, the
     alert flashes, the compass needle settles, and so on. One short gesture
     each, triggered on hover or keyboard focus. */
  .journey .step { cursor: default; outline: none; }
  .journey .step .dot { transition: border-color .25s ease, background .25s ease, transform .25s ease; }
  .journey .step:hover .dot, .journey .step:focus-visible .dot {
    border-color: rgba(34,223,245,.7); background: rgba(34,223,245,.1); transform: translateY(-2px);
  }
  .journey .step:focus-visible .dot { box-shadow: 0 0 0 3px rgba(34,223,245,.25); }
  .journey .step .ico * { transform-box: fill-box; transform-origin: center; }

  /* 1 Funding, the coin gives a small confident nudge. */
  .journey .step[data-step="funding"]:hover .ico,
  .journey .step[data-step="funding"]:focus-visible .ico { animation: st-nudge .5s ease; }
  @keyframes st-nudge { 40% { transform: translateY(-2.5px); } 100% { transform: none; } }

  /* 2 Visibility, the eye closes and opens. */
  .journey .step[data-step="visibility"] .eye-pupil { transition: opacity .12s; }
  .journey .step[data-step="visibility"]:hover .eye-outline,
  .journey .step[data-step="visibility"]:focus-visible .eye-outline { animation: st-blink .75s ease; }
  .journey .step[data-step="visibility"]:hover .eye-pupil,
  .journey .step[data-step="visibility"]:focus-visible .eye-pupil { animation: st-pupil .75s ease; }
  @keyframes st-blink { 45% { transform: scaleY(.08); } 70% { transform: scaleY(1); } }
  @keyframes st-pupil { 35%, 62% { opacity: 0; } }

  /* 3 Early Detection, the warning blinks, the way an alert would. */
  .journey .step[data-step="detection"]:hover .alert,
  .journey .step[data-step="detection"]:focus-visible .alert { animation: st-alert .85s ease; }
  @keyframes st-alert {
    0%, 100% { opacity: 1; }
    20%, 60% { opacity: .15; }
    40%, 80% { opacity: 1; }
  }

  /* 4 Guidance, the needle swings and settles, like a compass finding north. */
  .journey .step[data-step="guidance"]:hover .needle,
  .journey .step[data-step="guidance"]:focus-visible .needle { animation: st-compass 1.1s cubic-bezier(.3,1.4,.5,1); }
  @keyframes st-compass {
    0% { transform: rotate(0deg); }
    35% { transform: rotate(200deg); }
    65% { transform: rotate(320deg); }
    85% { transform: rotate(350deg); }
    100% { transform: rotate(360deg); }
  }

  /* 5 Stronger Performance, the trend line pops upward. */
  .journey .step[data-step="growth"]:hover .trend,
  .journey .step[data-step="growth"]:focus-visible .trend { animation: st-pop .55s cubic-bezier(.3,1.5,.5,1); }
  @keyframes st-pop {
    45% { transform: translate(1.5px, -2.5px) scale(1.12); }
    100% { transform: none; }
  }

  /* 6 Verified Track Record, the tick clears and redraws itself. */
  .journey .step[data-step="record"] .tick { stroke-dasharray: 12; }
  .journey .step[data-step="record"]:hover .tick,
  .journey .step[data-step="record"]:focus-visible .tick { animation: st-tick .7s ease forwards; }
  @keyframes st-tick {
    0% { stroke-dashoffset: 0; }
    35% { stroke-dashoffset: 12; }
    100% { stroke-dashoffset: 0; }
  }

  /* 7 Greater Financial Readiness, a small burst of confetti. */
  .journey .step .spark { position: absolute; inset: 0; pointer-events: none; }
  .journey .step .spark i {
    position: absolute; top: 50%; left: 50%; width: 3px; height: 3px; border-radius: 1px;
    background: var(--cyan); opacity: 0;
  }
  .journey .step .spark i:nth-child(2) { background: #ffd166; }
  .journey .step .spark i:nth-child(4) { background: #4ade80; }
  .journey .step .spark i:nth-child(6) { background: #fff; }
  .journey .step[data-step="readiness"]:hover .spark i,
  .journey .step[data-step="readiness"]:focus-visible .spark i { animation: st-confetti .75s ease-out forwards; }
  .journey .step .spark i:nth-child(1) { --tx: -17px; --ty: -15px; animation-delay: 0s !important; }
  .journey .step .spark i:nth-child(2) { --tx:   0px; --ty: -21px; animation-delay: .04s !important; }
  .journey .step .spark i:nth-child(3) { --tx:  17px; --ty: -15px; animation-delay: .02s !important; }
  .journey .step .spark i:nth-child(4) { --tx: -20px; --ty:   3px; animation-delay: .07s !important; }
  .journey .step .spark i:nth-child(5) { --tx:  20px; --ty:   3px; animation-delay: .05s !important; }
  .journey .step .spark i:nth-child(6) { --tx:   0px; --ty:  15px; animation-delay: .09s !important; }
  @keyframes st-confetti {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(.4); }
    25%  { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .journey .step * { animation: none !important; }
  }
  /* Arrow sits level with the icon circle, not the centre of the taller label block. */
  .journey .arrow { flex: 0 0 auto; color: #5f79a0; height: 46px; display: grid; place-items: center; margin: 0 -4px; }
  .journey .arrow svg { width: 30px; height: 11px; display: block; }
  .role-picks { display: flex; gap: 16px; margin-top: clamp(18px, 3.2vh, 36px); flex-wrap: wrap; justify-content: center; }
  .saved-note { margin-top: 16px; font-size: 12px; color: #9fb6d1; text-align: center; }
  .saved-note button {
    background: none; border: 0; color: var(--cyan); font-weight: 700; font-size: 12px;
    cursor: pointer; text-decoration: underline; padding: 0; font-family: inherit;
  }
  /* Pinned to the corner rather than sitting in the flow, so it costs the
     centred column no vertical space. */
  .to-launch {
    position: absolute; top: 18px; left: 20px; z-index: 5;
    display: inline-flex; align-items: center; gap: 9px; padding: 9px 16px;
    border-radius: 10px; border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.05);
    color: #cbd8e8; font-size: 13px; font-weight: 700; text-decoration: none;
  }
  .to-launch:hover { background: rgba(255,255,255,.11); color: #fff; border-color: rgba(255,255,255,.45); }
  .role-btn {
    background: #fff; color: var(--navy); border: 0; border-radius: 13px;
    padding: clamp(13px, 2.2vh, 20px) 24px; width: 250px;
    cursor: pointer; box-shadow: var(--shadow-lg); text-align: left; transition: transform .1s;
  }
  .role-btn:hover { transform: translateY(-2px); }
  .role-btn .rb-ico { font-size: 20px; line-height: 0; }
  .role-btn .rb-ico svg { width: 24px; height: 24px; display: block; }
  .role-btn .rb-title { font-weight: 800; font-size: 16px; margin-top: 8px; }
  .role-btn .rb-sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
  .role-btn.accent { background: var(--accent); color: #fff; }
  .role-btn.accent .rb-sub { color: #e4f6f9; }

  /* ---------- App shell ---------- */
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 236px; flex: 0 0 236px; background: var(--navy); color: #fff; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  .brand { padding: 20px 18px 16px; border-bottom: 1px solid rgba(255,255,255,.1); }
  .brand .logo { display: flex; align-items: center; gap: 9px; }
  .brand .mark {
    width: 30px; height: 30px; display: block; object-fit: contain; flex: 0 0 auto;
    filter: drop-shadow(0 0 1px rgba(255,255,255,.5)) drop-shadow(0 0 6px rgba(255,255,255,.25));
  }
  .brand h1 { font-size: 16px; letter-spacing: -0.02em; }
  .role-badge { margin-top: 10px; display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.1); padding: 4px 10px; border-radius: 999px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #cbd8e8; }
  .switch-role { margin-top: 8px; }
  .switch-role button { background: none; border: 0; color: #9fb6d1; font-size: 11.5px; font-weight: 700; cursor: pointer; padding: 0; transition: color .2s ease; }
  .switch-role button:hover { color: #fff; }
  .biz-picker { padding: 12px 18px; border-bottom: 1px solid rgba(255,255,255,.1); }
  .biz-picker label { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: #7d94b3; font-weight: 700; }
  .biz-picker select { width: 100%; margin-top: 6px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); color: #fff; border-radius: 8px; padding: 7px 8px; font-size: 12.5px; font-weight: 600; }
  .biz-picker select option { color: #0a2540; }

  .nav { padding: 10px; display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px;
    color: #cbd8e8; cursor: pointer; border: 0; background: transparent; width: 100%;
    text-align: left; font-weight: 650; font-size: 13px;
  }
  .nav-item:hover { background: rgba(255,255,255,.07); color: #fff; }
  .nav-item.active { background: rgba(255,255,255,.14); color: #fff; }
  .nav-item .count {
    margin-left: auto; background: rgba(255,255,255,.16); border-radius: 999px;
    min-width: 19px; height: 19px; padding: 0 6px; display: inline-flex; align-items: center;
    justify-content: center; font-size: 10.5px; font-weight: 800;
  }
  /* Outstanding suggestions read as something needing attention, so the badge is
     red rather than the brand colour. */
  .nav-item .count.alarm { background: #d64541; color: #fff; box-shadow: 0 0 0 3px rgba(214,69,65,.18); }
  .sidebar-foot { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,.1); color: #7d94b3; font-size: 10.5px; }
  /* Always reachable, so a demo that has drifted can be put back at any point. */
  .reset-inline {
    display: block; margin-top: 8px; background: none; border: 0; padding: 0;
    color: var(--cyan); font-size: 10.5px; font-weight: 700; cursor: pointer;
    text-decoration: underline; font-family: inherit;
  }

  .main { flex: 1; min-width: 0; }
  .topbar { background: #fff; border-bottom: 1px solid var(--line); padding: 14px 26px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 20; flex-wrap: wrap; }
  .topbar .title h2 { font-size: 18px; }
  .topbar .title p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
  .topbar .spacer { flex: 1; }
  .btn { border: 0; padding: 9px 15px; border-radius: 9px; font-weight: 650; cursor: pointer; background: var(--accent); color: #fff; font-size: 12.5px; }
  .btn.ghost { background: #fff; color: var(--navy); border: 1px solid var(--line); }
  .btn.sm { padding: 6px 11px; font-size: 11.5px; }
  .view { padding: 22px 26px 50px; }

  /* ---------- Generic ---------- */
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .panel-head { padding: 14px 17px; border-bottom: 1px solid var(--line-2); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .panel-head h3 { font-size: 14px; }
  .panel-head .hint { color: var(--muted); font-size: 11.5px; font-weight: 500; }
  .panel-body { padding: 17px; }
  .muted { color: var(--muted); }
  .tiny { font-size: 11px; }
  .mono { font-variant-numeric: tabular-nums; }
  .grid2 { display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; align-items: start; }
  .stack { display: grid; gap: 16px; }

  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 10.5px; font-weight: 750; white-space: nowrap; }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .chip.green { background: var(--green-soft); color: var(--green); }
  .chip.yellow { background: var(--yellow-soft); color: var(--yellow); }
  .chip.red { background: var(--red-soft); color: var(--red); }
  .chip.blue { background: var(--blue-soft); color: var(--blue); }
  .chip.grey { background: var(--grey-soft); color: var(--grey); }

  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin-bottom: 18px; }
  .kpis.k4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
  .kpi {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 13px 15px; box-shadow: var(--shadow); text-align: left; font-family: inherit; width: 100%;
  }
  .kpi .label { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
  .kpi .value { font-size: 23px; font-weight: 750; margin-top: 4px; }
  .kpi .foot { font-size: 11px; color: var(--faint); margin-top: 2px; }
  /* "Needs attention" is a shortcut into the filtered list, so it behaves like
     a control rather than a read-only figure. */
  .kpi.act { cursor: pointer; transition: border-color .18s ease, transform .06s ease; }
  .kpi.act:hover { border-color: var(--navy-3); }
  .kpi.act:active { transform: translateY(1px); }
  .kpi.alarm .value { color: var(--red); }
  .kpi.alarm.act:hover { border-color: var(--red); }

  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 9px 12px; border-bottom: 1px solid var(--line); background: #fafcfe; white-space: nowrap; }
  tbody td { padding: 11px 12px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
  tbody tr[data-biz]:hover { background: #f7fafd; cursor: pointer; }
  tbody tr:last-child td { border-bottom: 0; }
  .biz-cell { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 32px; height: 32px; border-radius: 9px; flex: 0 0 32px; display: grid; place-items: center; font-weight: 750; font-size: 11.5px; color: #fff; background: var(--navy-3); }
  .biz-cell .nm { font-weight: 700; font-size: 13px; }
  .biz-cell .sc { color: var(--muted); font-size: 11px; }
  .scorebox { display: flex; align-items: center; gap: 8px; }
  .scorenum { font-weight: 750; font-size: 14px; min-width: 28px; }
  .minibar { width: 46px; height: 5px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .minibar i { display: block; height: 100%; }
  .minibar i.green { background: var(--green); } .minibar i.yellow { background: var(--yellow); } .minibar i.red { background: var(--red); }
  .trend { font-weight: 700; font-size: 12px; }
  .trend.up { color: var(--green); } .trend.down { color: var(--red); } .trend.flat { color: var(--faint); }
  .toolbar { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; margin-bottom: 13px; }
  .seg { display: flex; background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; padding: 6px 11px; border-radius: 6px; cursor: pointer; font-weight: 650; color: var(--muted); font-size: 12px; }
  .seg button.on { background: var(--navy); color: #fff; }
  .field { display: flex; align-items: center; gap: 6px; background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; }
  .field label { color: var(--muted); font-size: 11.5px; font-weight: 600; }
  .field select, .field input { border: 0; background: transparent; color: var(--ink); font-weight: 650; outline: none; font-size: 12px; }
  .empty { padding: 34px 18px; text-align: center; color: var(--muted); }
  .empty .big { font-size: 26px; opacity: .35; margin-bottom: 6px; }
  .back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; cursor: pointer; color: var(--muted); font-weight: 650; padding: 0; margin-bottom: 13px; font-size: 12.5px; }
  .back:hover { color: var(--navy); }

  /* ---------- Score / decision ---------- */
  .score-hero { display: flex; align-items: center; gap: 20px; padding: 18px; flex-wrap: wrap; }
  .ring { width: 96px; height: 96px; flex: 0 0 96px; border-radius: 50%; display: grid; place-items: center; }
  .ring > div { width: 78px; height: 78px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: var(--shadow); }
  .ring .n { font-size: 26px; font-weight: 800; }
  .ring .u { font-size: 8.5px; color: var(--muted); font-weight: 700; letter-spacing: .05em; }
  .decision { border-radius: var(--radius); padding: 15px 17px; display: flex; gap: 13px; align-items: flex-start; border: 1px solid; }
  .decision.release { background: var(--green-soft); border-color: #b5e3d0; }
  .decision.hold { background: var(--yellow-soft); border-color: #f0d59b; }
  .decision.escalate { background: var(--red-soft); border-color: #f3c0bb; }
  .decision .glyph { font-size: 19px; }
  .decision .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; font-weight: 750; opacity: .8; }
  .decision .act { font-size: 15.5px; font-weight: 750; margin: 2px 0 4px; }
  .decision.release .act { color: var(--green); } .decision.hold .act { color: var(--yellow); } .decision.escalate .act { color: var(--red); }
  .decision .why { font-size: 12.5px; color: #38495e; }

  .factor { padding: 11px 0; border-bottom: 1px solid var(--line-2); }
  .factor:last-child { border-bottom: 0; padding-bottom: 0; }
  .factor .top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; flex-wrap: wrap; }

<script>
(function () {
  'use strict';

  /* =========================================================================
     1. SCORING ENGINE, rules-based, fully explainable.
     ========================================================================= */
  var WEIGHTS = { revenue: 0.35, expense: 0.25, consistency: 0.20, customers: 0.20 };
  var CREDIT_WEIGHTS = { trend: 0.40, stability: 0.35, discipline: 0.25 };

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function round1(v) { return Math.round(v * 10) / 10; }
  function tierOf(score) { return score >= 80 ? 'green' : score >= 50 ? 'yellow' : 'red'; }
  function tierLabel(t) { return t === 'green' ? 'Healthy' : t === 'yellow' ? 'Watch' : 'At Risk'; }
  function statusPoints(s) { return s === 'on-time' ? 1 : s === 'late' ? 0.5 : 0; }

  function windowGrowth(history, key) {
    var n = history.length, recent = history.slice(-3), prior = history.slice(Math.max(0, n - 6), Math.max(0, n - 3));
    if (!prior.length || !recent.length) return 0;
    function avg(a) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i][key]; return s / a.length; }
    var p = avg(prior); return p === 0 ? 0 : (avg(recent) - p) / p;
  }

  function revenueFactor(g) { return clamp(55 + g * 300, 0, 100); }
  function expenseFactor(ratio) { return clamp(100 - Math.max(0, ratio - 0.6) * 200, 0, 100); }
  function consistencyFactor(hist) {
    var w = hist.slice(-6), s = 0;
    for (var i = 0; i < w.length; i++) s += statusPoints(w[i].status);
    return w.length ? (s / w.length) * 100 : 0;
  }
  function customerFactor(g) { return clamp(55 + g * 300, 0, 100); }

  function computeHealth(biz) {
    var h = biz.history;
    var revGrowth = windowGrowth(h, 'revenue'), custGrowth = windowGrowth(h, 'customers'), expGrowth = windowGrowth(h, 'expenses');
    var last3 = h.slice(-3), rev = 0, exp = 0;
    for (var i = 0; i < last3.length; i++) { rev += last3[i].revenue; exp += last3[i].expenses; }
    rev /= last3.length; exp /= last3.length;
    var ratio = rev === 0 ? 2 : exp / rev;
    var f = { revenue: revenueFactor(revGrowth), expense: expenseFactor(ratio), consistency: consistencyFactor(h), customers: customerFactor(custGrowth) };
    var score = round1(f.revenue * WEIGHTS.revenue + f.expense * WEIGHTS.expense + f.consistency * WEIGHTS.consistency + f.customers * WEIGHTS.customers);
    var w6 = h.slice(-6), onTime = 0, late = 0, missed = 0;
    for (var j = 0; j < w6.length; j++) { if (w6[j].status === 'on-time') onTime++; else if (w6[j].status === 'late') late++; else missed++; }
    return { score: score, tier: tierOf(score), factors: f, revGrowth: revGrowth, expGrowth: expGrowth, custGrowth: custGrowth, ratio: ratio, onTime: onTime, late: late, missed: missed, periods: w6.length, avgRevenue: rev, avgExpenses: exp };
  }
  function healthAt(biz, endIndex) { return computeHealth({ history: biz.history.slice(0, endIndex + 1) }); }
  function scoreDelta(biz) { if (biz.history.length < 2) return 0; return round1(computeHealth(biz).score - healthAt(biz, biz.history.length - 2).score); }
  function trendOf(biz) { var d = scoreDelta(biz); return d > 1.5 ? 'up' : d < -1.5 ? 'down' : 'flat'; }

  function computeCredit(biz) {
    var h = biz.history, growths = [];
    for (var i = 1; i < h.length; i++) { var p = h[i - 1].revenue || 1; growths.push((h[i].revenue - p) / p); }
    var avgG = growths.length ? growths.reduce(function (a, b) { return a + b; }, 0) / growths.length : 0;
    var trend = clamp(40 + avgG * 1500, 0, 100);
    var ratios = h.map(function (x) { return x.expenses / (x.revenue || 1); });
    var meanR = ratios.reduce(function (a, b) { return a + b; }, 0) / ratios.length;
    var varR = Math.sqrt(ratios.reduce(function (s, r) { return s + Math.pow(r - meanR, 2); }, 0) / ratios.length);
    var stability = clamp(100 - Math.max(0, meanR - 0.6) * 200 - varR * 300, 0, 100);
    var pts = h.reduce(function (s, x) { return s + statusPoints(x.status); }, 0);
    var discipline = (pts / h.length) * 100;
    var score = round1(trend * CREDIT_WEIGHTS.trend + stability * CREDIT_WEIGHTS.stability + discipline * CREDIT_WEIGHTS.discipline);
    return { score: score, factors: { trend: trend, stability: stability, discipline: discipline }, avgGrowth: avgG, meanRatio: meanR, volatility: varR, periods: h.length };
  }

  /* The four bands in order, named exactly as the pitch deck defines them. */
  var CR_BANDS = ['Building Track Record', 'Developing', 'Strong Evidence', 'Credit-Ready Candidate'];

  function creditReadiness(biz) {
    var cr = computeCredit(biz), periods = biz.history.length;
    var done = biz.milestones.filter(function (m) { return m.status === 'done'; }).length;
    var last = biz.history[biz.history.length - 1];
    var cashPositive = (last.revenue - last.expenses) > 0;
    var reasons = [];
    reasons.push(periods + ' month' + (periods === 1 ? '' : 's') + ' of numbers on record');
    reasons.push(cr.avgGrowth > 0.005 ? 'Sales growing by about ' + pct(cr.avgGrowth, 1) + ' a month' : 'Sales are not growing steadily yet');
    reasons.push(cr.meanRatio <= 0.75 ? 'Spending has stayed under control' : 'Spending is high compared with what comes in');
    reasons.push(done + ' of ' + biz.milestones.length + ' stages finished');
    reasons.push(cashPositive ? 'Earning more than it spends' : 'Spending more than it earns right now');
    var status;
    /* Band names match the pitch deck exactly, each paired with a plain-English
       line so the meaning is clear without needing the deck to hand. */
    var plain;
    if (periods < 4 || cr.score < 45) { status = 'Building Track Record'; plain = 'Still early, not enough history yet'; }
    else if (cr.score < 62) { status = 'Developing'; plain = 'Coming along, with more to prove'; }
    else if (cr.score < 80) { status = 'Strong Evidence'; plain = 'A solid record is building up'; }
    else { status = 'Credit-Ready Candidate'; plain = 'Ready for a funding conversation'; }
    var color = status === 'Building Track Record' ? 'grey' : status === 'Developing' ? 'yellow' : status === 'Strong Evidence' ? 'blue' : 'green';
    return { status: status, plain: plain, score: cr.score, reasons: reasons, color: color };
  }

  function decisionFor(biz) {
    var health = computeHealth(biz);
    if (health.tier === 'green') return { kind: 'release', action: 'Doing well. Keep going', why: 'A score of ' + health.score + ' is healthy. Sales and customers are both moving in the right direction.' };
    if (health.tier === 'yellow') return { kind: 'hold', action: 'Needs a check-in', why: 'A score of ' + health.score + ' means keep an eye on this one. ' + weakestFactorPhrase(health) };
    return { kind: 'escalate', action: 'Needs attention now', why: 'A score of ' + health.score + ' is low. ' + weakestFactorPhrase(health) };
  }
  function weakestFactorPhrase(health) {
    var names = { revenue: 'Sales are the biggest problem', expense: 'Spending is the biggest problem', consistency: 'Late or missed updates are the biggest problem', customers: 'Losing customers is the biggest problem' };
    var worst = null, worstVal = Infinity;
    for (var k in health.factors) { if (health.factors[k] < worstVal) { worstVal = health.factors[k]; worst = k; } }
    return names[worst] + ' at ' + Math.round(worstVal) + '/100.';
  }

  /* =========================================================================
     2. GUIDANCE ENGINE, explains the problem, gives a practical next step.
     ========================================================================= */
  /* Advice quotes the business's own figures, so two businesses with the same
     underlying problem never read as the same generic note. */
  function getGuidance(biz) {
    var h = computeHealth(biz), out = [];
    var last = biz.history[biz.history.length - 1];
    var prev = biz.history[biz.history.length - 2] || last;
    var ratio = last.revenue ? last.expenses / last.revenue : 1;
    /* Biggest expense line this month, named so the advice points somewhere. */
    var topCost = biz.ledger.filter(function (t) { return t.type === 'expense'; })
      .sort(function (a, b) { return b.amount - a.amount; })[0];

    if (h.revGrowth <= -0.15) {
      out.push({ sev: 'red',
        issue: 'Your sales have dropped sharply: down ' + Math.abs(Math.round(h.revGrowth * 100)) + '% on the months before.',
        rec: 'Sales fell from ' + money(prev.revenue) + ' to ' + money(last.revenue) + '. Look at which customers or products brought in less than usual, and start there.' });
    }

    if (h.expGrowth > h.revGrowth && h.expGrowth > 0.02) {
      /* Same rule, but the wording and urgency follow how tight it actually is. */
      if (ratio >= 0.95) {
        out.push({ sev: 'red',
          issue: 'Costs have caught up with your sales: you are spending R' + ratio.toFixed(2) + ' for every R1 you earn.',
          rec: topCost ? 'Your biggest cost this month was ' + topCost.desc.toLowerCase() + ' at ' + money(topCost.amount) + '. That is the first one to bring down.'
                       : 'Bring your largest cost down before it overtakes what you earn.' });
      } else {
        out.push({ sev: 'yellow',
          issue: 'Your costs are creeping up faster than your sales.',
          rec: 'You keep about ' + money(last.revenue - last.expenses) + ' of every month right now. ' +
               (topCost ? 'Check ' + topCost.desc.toLowerCase() + ' at ' + money(topCost.amount) + ' first: it is your largest cost.' : 'Review your largest costs first.') });
      }
    }

    if ((last.revenue - last.expenses) < 0) {
      out.push({ sev: 'red',
        issue: 'You spent ' + money(Math.abs(last.revenue - last.expenses)) + ' more than you brought in this month.',
        rec: 'List what still has to be paid and cover only what the business cannot run without until sales recover.' });
    }
    var delayedStage = biz.milestones.filter(function (m) { return m.status === 'delayed'; })[0];
    if (delayedStage) {
      out.push({ sev: 'yellow',
        issue: 'You are behind on "' + delayedStage.label + '".',
        rec: 'Work out what is holding this stage up, then set a new date you can realistically meet. Your funder can see it is running late.' });
    }

    if (h.missed > 0) {
      out.push({ sev: 'yellow',
        issue: 'You have missed ' + h.missed + ' monthly update' + (h.missed === 1 ? '' : 's') + '.',
        rec: 'Sending your numbers on time is a fifth of your score. Catching up is the quickest improvement available to you.' });
    }

    if (!out.length && h.tier === 'green') {
      out.push({ sev: 'green',
        issue: 'Steady month. You kept ' + money(last.revenue - last.expenses) + ' after costs.',
        rec: 'You are ' + biz.milestones.filter(function (m) { return m.status === 'done'; }).length + ' of ' + biz.milestones.length +
             ' stages in with ' + biz.history.length + ' months on record. Keep sending your numbers, this history is what your next funding conversation rests on.' });
    }
    if (!out.length) out.push({ sev: 'yellow', issue: 'Nothing serious this month, but a few things are worth watching.', rec: 'Keep sending your numbers on time so any problem shows up early.' });
    return out;
  }

  /* =========================================================================
     3. DEMO DATA, 10 fictional South African SMEs.
     ========================================================================= */
  /* Reporting months are generated relative to today so the demo never looks
     stale: the most recent month is always last month, and the next update is
     always genuinely due soon. Fixed dates would read as months overdue to
     anyone opening this later. */
  var PERIOD_DATES = (function () {
    var out = [], now = new Date();
    /* Month 6 of the seed is last month; count back five from there. */
    for (var i = 5; i >= 0; i--) {
      var d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() - 1 - i, 15));
      out.push(d.toISOString().slice(0, 10));
    }
    /* Room for months submitted during the demo. */
    for (var j = 0; j < 6; j++) {
      var f = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + j, 15));
      out.push(f.toISOString().slice(0, 10));
    }
    return out;
  })();
  /* Plain-language stage names, anyone should understand these without a
     glossary. "Onboarding & Setup" became "Getting set up", and so on. */
  var MSTAGES = ['Getting set up', 'Open and trading', 'Growing the business', 'Standing on its own'];
  var EXP_CATEGORIES = ['Stock & Inventory', 'Rent', 'Wages', 'Transport', 'Marketing', 'Utilities', 'Other'];

  function milestoneSet(doneCount, activeStatus) {
    return MSTAGES.map(function (label, i) {
      if (i < doneCount) return { label: label, status: 'done' };
      if (i === doneCount) return { label: label, status: activeStatus || 'current' };
      return { label: label, status: 'pending' };
    });
  }

  /* Three businesses, one per situation, so the difference is obvious at a
     glance: one doing well, one in the middle, one in trouble. */
  var DEFS = [
    /* Figures are sized for AYEF-scale youth grants: R100k-R150k of funding, and
       monthly trading in the tens of thousands. A business turning over R240k a
       month would not be applying for a R150k start-up grant, so revenue is kept
       proportionate to the funding it received. */

    /* DOING WELL, growing sales, costs under control, always reports on time. */
    { id: 'nandi-beauty', name: 'Nandi Beauty Studio', industry: 'Beauty & Wellness', owner: 'Nandi Mahlangu', region: 'Tembisa, GP', fundingAmount: 150000,
      milestones: milestoneSet(3, 'current'), model: { rev: 0.038, exp: 0.022, cust: 0.035, vol: 0.008, miss: 0.02 }, base: { revenue: 48000, expenses: 27500, customers: 145 }, reporting: 'sent',
      team: { staff: 3, roles: 'Two stylists and a receptionist' }, started: '2024-03' },

    /* IN THE MIDDLE, sales growing slowly, costs rising faster, one late report. */
    { id: 'soweto-bakery', name: 'Soweto Sunrise Bakery', industry: 'Food & Beverage', owner: 'Palesa Dlamini', region: 'Soweto, GP', fundingAmount: 120000,
      milestones: milestoneSet(2, 'current'), model: { rev: 0.012, exp: 0.030, cust: 0.009, vol: 0.012, miss: 0.05 }, base: { revenue: 36000, expenses: 24500, customers: 160 }, lateAt: [3], reporting: 'due',
      team: { staff: 4, roles: 'A baker, two counter staff and a driver' }, started: '2024-08' },

    /* IN TROUBLE, sales falling, spending more than it earns, reports missed.
       Also carries the scripted bad month used by the "log a rough month" demo. */
    { id: 'zola-deliveries', name: 'Zola Deliveries', industry: 'Transport', owner: 'Zola Mokoena', region: 'Pretoria, GP', fundingAmount: 100000,
      milestones: milestoneSet(1, 'delayed'), model: { rev: -0.018, exp: 0.026, cust: -0.016, vol: 0.014, miss: 0.10 }, base: { revenue: 32000, expenses: 26500, customers: 95 }, lateAt: [1, 4], reporting: 'late',
      team: { staff: 2, roles: 'Two drivers' }, started: '2025-01',
      script: [{ rev: -0.46, exp: 0.20, cust: -0.40, status: 'missed' }] }
  ];

  function buildHistory(def) {
    var h = [], rev = def.base.revenue, exp = def.base.expenses, cust = def.base.customers;
    /* A business that reports late is genuinely a month behind, so its whole
       record is shifted back one month and ends a month earlier than the
       businesses that are up to date. */
    var lag = def.reporting === 'late' ? 1 : 0;
    for (var i = 0; i < 6; i++) {
      if (i > 0) { rev *= (1 + def.model.rev); exp *= (1 + def.model.exp); cust *= (1 + def.model.cust); }
      var d = new Date(PERIOD_DATES[i] + 'T00:00:00Z');
      d.setUTCMonth(d.getUTCMonth() - lag);
      h.push({ period: 'P' + (i + 1), date: d.toISOString().slice(0, 10), revenue: Math.round(rev / 100) * 100, expenses: Math.round(exp / 100) * 100, customers: Math.round(cust), status: (def.lateAt && def.lateAt.indexOf(i) !== -1) ? 'late' : 'on-time' });
    }
    return h;
  }
  /* Recent transactions for the latest month only, a short, readable list
     rather than pages of rows. Descriptions are written per trade so they read
     like a real business's books, not generic category names. */
  var LEDGER_LINES = {
    'nandi-beauty': [
      { desc: 'Salon takings for the month', category: 'Sales', type: 'revenue', share: 1 },
      { desc: 'Hair products and colour stock', category: 'Stock & Inventory', type: 'expense', share: 0.34 },
      { desc: 'Assistant stylist wages', category: 'Wages', type: 'expense', share: 0.30 },
      { desc: 'Salon rent', category: 'Rent', type: 'expense', share: 0.22 },
      { desc: 'Electricity and water', category: 'Utilities', type: 'expense', share: 0.08 },
      { desc: 'Instagram promotion', category: 'Marketing', type: 'expense', share: 0.06 }
    ],
    'soweto-bakery': [
      { desc: 'Bread and cake sales', category: 'Sales', type: 'revenue', share: 1 },
      { desc: 'Flour, sugar and yeast', category: 'Stock & Inventory', type: 'expense', share: 0.38 },
      { desc: 'Baker and counter staff', category: 'Wages', type: 'expense', share: 0.27 },
      { desc: 'Shop rent', category: 'Rent', type: 'expense', share: 0.18 },
      { desc: 'Gas for the ovens', category: 'Utilities', type: 'expense', share: 0.11 },
      { desc: 'Delivery fuel', category: 'Transport', type: 'expense', share: 0.06 }
    ],
    'zola-deliveries': [
      { desc: 'Delivery fees collected', category: 'Sales', type: 'revenue', share: 1 },
      { desc: 'Petrol for the bakkie', category: 'Transport', type: 'expense', share: 0.36 },
      { desc: 'Driver wages', category: 'Wages', type: 'expense', share: 0.30 },
      { desc: 'Vehicle service and repairs', category: 'Transport', type: 'expense', share: 0.18 },
      { desc: 'Insurance premium', category: 'Other', type: 'expense', share: 0.10 },
      { desc: 'Airtime and data', category: 'Utilities', type: 'expense', share: 0.06 }
    ]
  };

  function buildLedger(def, history) {
    var p = history[history.length - 1];
    var lines = LEDGER_LINES[def.id] || LEDGER_LINES['soweto-bakery'];
    return lines.map(function (l, i) {
      var base = l.type === 'revenue' ? p.revenue : p.expenses;
      /* Spread the entries across the month so dates are not all identical. */
      var day = new Date(p.date + 'T00:00:00Z');
      day.setUTCDate(day.getUTCDate() - (lines.length - 1 - i) * 3);
      return {
        date: day.toISOString().slice(0, 10), period: p.period,
        desc: l.desc, category: l.category, type: l.type,
        amount: Math.round(base * l.share / 10) * 10
      };
    });
  }

  function makeSeed() {
    return DEFS.map(function (d) {
      var history = buildHistory(d);
      return {
        id: d.id, name: d.name, industry: d.industry, owner: d.owner, region: d.region, fundingAmount: d.fundingAmount,
        reporting: d.reporting || 'due',
        team: d.team || { staff: 0, roles: '' }, started: d.started || '',
        milestones: JSON.parse(JSON.stringify(d.milestones)),
        model: d.model, script: d.script ? JSON.parse(JSON.stringify(d.script)) : null, scriptStep: 0,
        history: history, ledger: buildLedger(d, history), notes: []
      };
    });
  }

  /* =========================================================================
     4. STATE
     ========================================================================= */
  /* =========================================================================
     4b. PROOF STORE, real file storage, no server
     -------------------------------------------------------------------------
     Receipts are held as Blobs in IndexedDB, so an uploaded file survives a
     refresh and a browser restart and can be reopened or downloaded. Nothing
     leaves the machine and nothing needs installing, the prototype still runs
     by opening the file directly. A real deployment would post these to object
     storage instead; the calling code below would not change.
     ========================================================================= */
  var ProofStore = (function () {
    var DB = 'provenProofs', STORE = 'proofs', VERSION = 1, dbp = null;

    function open() {
      if (dbp) return dbp;
      dbp = new Promise(function (resolve, reject) {
        if (!window.indexedDB) { reject(new Error('IndexedDB unavailable')); return; }
        var req = indexedDB.open(DB, VERSION);
        req.onupgradeneeded = function (e) {
          var db = e.target.result;
          if (!db.objectStoreNames.contains(STORE)) {
            var os = db.createObjectStore(STORE, { keyPath: 'id' });
            os.createIndex('bizId', 'bizId', { unique: false });
          }
        };
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error); };
      });
      return dbp;
    }

    function tx(mode) {
      return open().then(function (db) { return db.transaction(STORE, mode).objectStore(STORE); });
    }

    return {
      available: function () { return !!window.indexedDB; },

      /* Store a File against a business + transaction reference. */
      put: function (bizId, txnRef, file) {
        return tx('readwrite').then(function (os) {
          return new Promise(function (resolve, reject) {
            var rec = {
              id: bizId + '::' + txnRef,
              bizId: bizId, txnRef: txnRef,
              name: file.name, size: file.size, type: file.type || 'application/octet-stream',
              uploadedAt: new Date().toISOString(), blob: file
            };
            var r = os.put(rec);
            r.onsuccess = function () { resolve(rec); };
            r.onerror = function () { reject(r.error); };
          });
        });
      },

      /* Every proof for one business, keyed by transaction ref. */
      listFor: function (bizId) {
        return tx('readonly').then(function (os) {
          return new Promise(function (resolve, reject) {
            var out = {};
            var req = os.index('bizId').openCursor(IDBKeyRange.only(bizId));
            req.onsuccess = function (e) {
              var c = e.target.result;
              if (!c) { resolve(out); return; }
              var v = c.value;
              out[v.txnRef] = { name: v.name, size: v.size, type: v.type, uploadedAt: v.uploadedAt };
              c.continue();
            };
            req.onerror = function () { reject(req.error); };
          });
        }).catch(function () { return {}; });
      },

      get: function (bizId, txnRef) {
        return tx('readonly').then(function (os) {
          return new Promise(function (resolve, reject) {
            var r = os.get(bizId + '::' + txnRef);
            r.onsuccess = function () { resolve(r.result || null); };
            r.onerror = function () { reject(r.error); };
          });
        });
      },

      /* Drop everything for one business, used when the demo's dates move on
         and the stored refs no longer match any transaction. */
      clearFor: function (bizId) {
        return tx('readwrite').then(function (os) {
          return new Promise(function (resolve) {
            var req = os.index('bizId').openCursor(IDBKeyRange.only(bizId));
            req.onsuccess = function (e) {
              var c = e.target.result;
              if (!c) { resolve(); return; }
              c.delete(); c.continue();
            };
            req.onerror = function () { resolve(); };
          });
        }).catch(function () {});
      },

      remove: function (bizId, txnRef) {
        return tx('readwrite').then(function (os) {
          return new Promise(function (resolve, reject) {
            var r = os.delete(bizId + '::' + txnRef);
            r.onsuccess = function () { resolve(); };
            r.onerror = function () { reject(r.error); };
          });
        });
      }
    };
  })();

  /* Proof metadata for the business on screen, mirrored here so render stays
     synchronous. Refreshed from IndexedDB whenever the business changes. */
  var proofIndex = {};

  /* Portfolio-wide evidence coverage. Rendering is synchronous, so the figure
     is computed once after the proofs load and cached here; null means "not
     counted yet" and the card shows a dash rather than a wrong 0%. */
  var portfolioCoverage = null;

  function refreshPortfolioCoverage() {
    if (!ProofStore.available()) return Promise.resolve(null);
    return Promise.all(state.businesses.map(function (b) {
      return ProofStore.listFor(b.id).then(function (map) {
        var total = 0, backed = 0;
        b.ledger.forEach(function (t, i) {
          total += t.amount;
          if (map[txnRef(t, i)]) backed += t.amount;
        });
        return { total: total, backed: backed };
      });
    })).then(function (list) {
      var t = 0, k = 0;
      list.forEach(function (r) { t += r.total; k += r.backed; });
      portfolioCoverage = t > 0 ? Math.round(k / t * 100) : 0;
      return portfolioCoverage;
    }).catch(function () { return null; });
  }

  /* Guard rails: keep the store to sensible receipt-sized files. */
  var MAX_PROOF = 8 * 1024 * 1024;
  var pendingProof = null;

  function refreshProofs(bizId) {
    if (!ProofStore.available()) return Promise.resolve({});
    return ProofStore.listFor(bizId).then(function (map) {
      proofIndex = map;
      proofsLoadedForBiz = bizId;
      /* Attaching or removing a document moves the portfolio figure too. */
      refreshPortfolioCoverage();
      return map;
    });
  }
  /* Which business proofIndex currently holds, regardless of who is looking. */
  var proofsLoadedForBiz = null;

  /* -------------------------------------------------------------------------
     Sample receipts. So the demo opens with evidence coverage already showing
     something real, a simple receipt is drawn for most expense entries and
     stored like any uploaded file, openable, downloadable, and counted in the
     coverage figure. Runs once; anything attached by hand is left alone.
     ------------------------------------------------------------------------- */
  function receiptSvg(biz, t) {
    var income = t.type === 'revenue';
    var vat = Math.round(t.amount * 0.15 / 1.15);
    var line = function (y, l, r, bold) {
      return '<text x="24" y="' + y + '" font-family="Segoe UI, Arial" font-size="12" fill="#0a2540"' +
             (bold ? ' font-weight="700"' : '') + '>' + esc(l) + '</text>' +
             '<text x="336" y="' + y + '" text-anchor="end" font-family="Segoe UI, Arial" font-size="12" fill="#0a2540"' +
             (bold ? ' font-weight="700"' : '') + '>' + esc(r) + '</text>';
    };
    return '<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300">' +
      '<rect width="360" height="300" fill="#ffffff"/>' +
      '<rect x="0" y="0" width="360" height="56" fill="#0a2540"/>' +
      '<text x="24" y="34" font-family="Segoe UI, Arial" font-size="15" font-weight="700" fill="#ffffff">' +
        (income ? 'Sales summary' : esc(t.category) + ' receipt') + '</text>' +
      '<line x1="24" y1="84" x2="336" y2="84" stroke="#dde5f0"/>' +
      line(76, esc(biz.name), fmtDate(t.date), true) +
      line(112, income ? 'Takings' : 'Item', 'Amount', true) +
      '<line x1="24" y1="122" x2="336" y2="122" stroke="#dde5f0"/>' +
      line(146, t.desc.length > 30 ? t.desc.slice(0, 29) + '…' : t.desc, money(t.amount - vat)) +
      line(170, 'VAT at 15%', money(vat)) +
      '<line x1="24" y1="186" x2="336" y2="186" stroke="#dde5f0"/>' +
      line(210, income ? 'Total banked' : 'Total paid', money(t.amount), true) +
      '<text x="24" y="248" font-family="Segoe UI, Arial" font-size="10.5" fill="#5d6f88">Reference ' +
        esc((biz.id.slice(0, 3) + t.period + Math.round(t.amount)).toUpperCase()) + '</text>' +
      '<text x="24" y="266" font-family="Segoe UI, Arial" font-size="10.5" fill="#8b9bb0">Sample document included with the demo</text>' +
      '</svg>';
  }

  function seedProofs() {
    if (!ProofStore.available()) return Promise.resolve();
    /* Transaction refs contain the entry date, and the demo's dates are
       generated relative to today, so a save made in a previous month points
       at refs that no longer exist and coverage silently reads 0%. Stamp the
       flag with the current period so the receipts are rebuilt when it moves. */
    var stamp = PERIOD_DATES[5] || '';
    try { if (localStorage.getItem('provenProofsSeeded') === stamp) return Promise.resolve(); } catch (e) {}
    /* How many expenses are left undocumented, per business. The well-run
       business has everything; the struggling one has gaps, its paperwork
       slips for the same reasons its numbers do. */
    var SKIP = { 'nandi-beauty': [], 'soweto-bakery': [4], 'zola-deliveries': [0, 2, 4, 5] };
    /* Clear first, receipts written against a previous period's dates are
       orphaned, then write the current set. The clear must finish before the
       puts, or it would delete the very records being added. */
    return Promise.all(state.businesses.map(function (b) { return ProofStore.clearFor(b.id); }))
      .then(function () {
        var jobs = [];
        state.businesses.forEach(function (biz) {
          var skip = SKIP[biz.id] || [];
          biz.ledger.forEach(function (t, i) {
            if (skip.indexOf(i) !== -1) return;
            var svg = receiptSvg(biz, t);
            var name = (t.type === 'revenue' ? 'sales-summary' : t.category.toLowerCase().replace(/[^a-z]+/g, '-')) + '-' + t.date + '.svg';
            var file;
            try {
              file = new File([svg], name, { type: 'image/svg+xml' });
            } catch (e) {
              /* Older browsers without the File constructor still store a Blob;
                 ProofStore keeps the name separately, so nothing is lost. */
              file = new Blob([svg], { type: 'image/svg+xml' });
              file.name = name;
            }
            jobs.push(ProofStore.put(biz.id, txnRef(t, i), file));
          });
        });
        return Promise.all(jobs);
      })
      .then(function () {
        try { localStorage.setItem('provenProofsSeeded', stamp); } catch (e) {}
      }).catch(function () {});
  }

  /* Stable reference for a ledger entry, proofs survive re-renders and sorting. */
  function txnRef(t, i) {
    return [t.period, t.date, t.type, t.category, Math.round(t.amount), i].join('|');
  }

  /* =========================================================================
     4c. SAVED WORK, changes stay put across refreshes
     -------------------------------------------------------------------------
     Transactions, submitted months and stage decisions are written to
     localStorage so anything done during a demo is still there after a
     reload. "Start the demo over" on the landing screen clears it.
     ========================================================================= */
  /* Bump this whenever the seed's shape changes, so a save written by an older
     version is discarded rather than loaded back over the new data. */
  var SAVE_KEY = 'provenState.v2';

  function saveState() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        businesses: state.businesses, draft: state.draft, savedAt: new Date().toISOString()
      }));
    } catch (e) { /* storage full or blocked, demo still works, just unsaved */ }
  }

  function loadSaved() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      var data = JSON.parse(raw);
      /* Only accept a shape that matches the current seed, so an old save from
         a previous version cannot half-load and corrupt the screen. */
      if (!data || !Array.isArray(data.businesses) || !data.businesses.length) return null;
      var seedIds = makeSeed().map(function (b) { return b.id; }).sort().join(',');
      var savedIds = data.businesses.map(function (b) { return b.id; }).sort().join(',');
      if (seedIds !== savedIds) return null;
      /* Matching ids are not enough, a save written before a field was added
         passes that check and then renders wrong (missing teams showed every
         business as 1 job). Require every field the UI reads. */
      var NEEDED = ['team', 'reporting', 'history', 'ledger', 'milestones'];
      var complete = data.businesses.every(function (b) {
        return NEEDED.every(function (k) { return b[k] != null; });
      });
      if (!complete) return null;
      return data;
    } catch (e) { return null; }
  }

  function clearSaved() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  }

  var saved = loadSaved();

  var state = {
    /* Opening /entrepreneur or /funder goes straight into that side. */
    role: roleFromPath(), bizId: 'soweto-bakery',
    entTab: 'overview', funderView: 'portfolio', profileId: null, profileReturn: 'funder', profileTab: 'overview',
    filterTier: 'all', query: '', sortKey: 'score',
    businesses: saved ? saved.businesses : makeSeed(),
    draft: saved && saved.draft ? saved.draft : {}
  };
  function byId(id) { for (var i = 0; i < state.businesses.length; i++) if (state.businesses[i].id === id) return state.businesses[i]; return null; }
  function draftFor(id) { if (!state.draft[id]) state.draft[id] = { revenue: 0, expenses: 0 }; return state.draft[id]; }

  /* =========================================================================
     5. HELPERS
     ========================================================================= */
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(n) { return 'R' + Math.round(n).toLocaleString('en-ZA'); }
  function moneyShort(n) { if (n >= 1000000) return 'R' + (n / 1000000).toFixed(1) + 'm'; if (n >= 1000) return 'R' + Math.round(n / 1000) + 'k'; return 'R' + Math.round(n); }
  function pct(n, d) { return (n >= 0 ? '+' : '') + (n * 100).toFixed(d === undefined ? 1 : d) + '%'; }
  function fmtDate(iso) { return new Date(iso + 'T00:00:00Z').toLocaleDateString('en-ZA', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }); }
  function fmtDateShort(iso) { return new Date(iso + 'T00:00:00Z').toLocaleDateString('en-ZA', { day: 'numeric', month: 'short', timeZone: 'UTC' }); }
  function initials(name) { return name.split(/\s+/).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase(); }
  function trendGlyph(t) { return t === 'up' ? '▲' : t === 'down' ? '▼' : '-'; }
  /* Share of the funding released so far. Money is drawn down as stages are
     reached, so this tracks progress through the stages rather than totalling
     every running cost, six months of trading expenses would exceed any grant
     and pin every business at 100%. */
  /* -------------------------------------------------------------------------
     Reporting cycle. Numbers are due on the 15th of the month after the one
     being reported, so both sides can always see when the next update is
     expected and whether it is late.
     ------------------------------------------------------------------------- */
  function reportingStatus(biz) {
    var last = biz.history[biz.history.length - 1];
    var due = new Date(last.date + 'T00:00:00Z');
    due.setUTCMonth(due.getUTCMonth() + 1);
    var today = new Date();
    var days = Math.round((due - today) / 86400000);
    var dueIso = due.toISOString().slice(0, 10);

    /* A business that is behind on its figures is behind on everything else
       too, so the three demo businesses sit at different points in the cycle:
       the well-run one has already sent this month's update, the middling one
       has it coming up, and the struggling one has let it slip. */
    var behaviour = biz.reporting || 'due';

    /* Everything is in, nothing owed until next month's deadline. */
    if (behaviour === 'sent') {
      return { due: dueIso, days: days, state: 'sent', sent: true,
        title: 'Everything is up to date',
        detail: 'Your ' + monthLabel(last.date) + ' update is in. The next one is due ' + fmtDate(dueIso) + '.',
        label: 'Up to date', covers: monthLabel(last.date) };
    }

    /* Behind: the deadline that has already passed is the one still owed, and
       the month it covers is the month before that. */
    if (behaviour === 'late') {
      var lateDue = new Date(due);
      while (lateDue > new Date()) lateDue.setUTCMonth(lateDue.getUTCMonth() - 1);
      var lateIso = lateDue.toISOString().slice(0, 10);
      var owedMonth = new Date(lateDue);
      owedMonth.setUTCMonth(owedMonth.getUTCMonth() - 1);
      var over = Math.max(1, Math.round((new Date() - lateDue) / 86400000));
      return { due: lateIso, days: -over, state: 'overdue', sent: false,
        title: 'Your ' + monthLabel(owedMonth.toISOString().slice(0, 10)) + ' update is still outstanding',
        detail: 'It was due ' + fmtDate(lateIso) + ', that is ' + over + ' day' + (over === 1 ? '' : 's') +
                ' ago. Sending on time counts for 20% of your score.',
        label: over + ' days late', covers: monthLabel(owedMonth.toISOString().slice(0, 10)) };
    }

    /* Up to date, with the next deadline approaching. */
    var state = days < 0 ? 'overdue' : days <= 7 ? 'due-soon' : 'ok';
    return {
      due: dueIso, days: days, state: state, sent: false,
      title: state === 'due-soon' ? 'Your next update is due soon'
           : state === 'overdue' ? 'Your ' + monthLabel(last.date) + ' update is late'
           : 'Everything is up to date',
      detail: state === 'overdue'
        ? 'It was due ' + fmtDate(dueIso) + '. Sending on time counts for 20% of your score.'
        : 'Your ' + monthLabel(last.date) + ' update is in. The next one is due ' + fmtDate(dueIso) +
          ' · ' + (days === 0 ? 'today' : 'in ' + days + ' day' + (days === 1 ? '' : 's')) + '.',
      label: state === 'overdue' ? (Math.abs(days) + ' days late')
           : days === 0 ? 'Due today'
           : 'Due in ' + days + ' day' + (days === 1 ? '' : 's'),
      covers: monthLabel(last.date)
    };
  }

  function fundingUtilisation(biz) {
    var total = biz.milestones.length;
    var done = biz.milestones.filter(function (m) { return m.status === 'done'; }).length;
    var inFlight = biz.milestones.some(function (m) { return m.status === 'current' || m.status === 'delayed'; }) ? 0.5 : 0;
    return clamp(Math.round((done + inFlight) / total * 100), 0, 100);
  }
  function currentMilestone(biz) { var m = biz.milestones.filter(function (x) { return x.status === 'current' || x.status === 'delayed'; })[0]; return m ? m.label : 'All stages finished'; }
  function milestoneProgress(biz) { var done = biz.milestones.filter(function (m) { return m.status === 'done'; }).length; return Math.round(done / biz.milestones.length * 100); }
  function showToast(msg) { var el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(function () { el.classList.remove('show'); }, 3400); }
  function counts() { var c = { green: 0, yellow: 0, red: 0 }; state.businesses.forEach(function (b) { c[computeHealth(b).tier]++; }); return c; }

  /* =========================================================================
     6. LINE CHART (dependency-free SVG)
     ========================================================================= */
  /* Month name for a period, e.g. "Feb 2026", used instead of P1/P2 wherever
     a person reads the chart or table. */
  function monthLabel(iso) {
    return new Date(iso + 'T00:00:00Z').toLocaleDateString('en-ZA', { month: 'short', year: 'numeric', timeZone: 'UTC' });
  }
  function monthShort(iso) {
    return new Date(iso + 'T00:00:00Z').toLocaleDateString('en-ZA', { month: 'short', timeZone: 'UTC' });
  }

  function lineChart(biz) {
    /* Roughly 4:1, wide and low, so a full-width panel does not scale the
       chart into a tall block that outgrows whatever sits beside it. */
    var h = biz.history.slice(-8), W = 760, H = 190, P = { t: 12, r: 16, b: 30, l: 52 }, iw = W - P.l - P.r, ih = H - P.t - P.b;
    var mx = Math.max.apply(null, h.map(function (x) { return Math.max(x.revenue, x.expenses); }));
    var mn = Math.min.apply(null, h.map(function (x) { return Math.min(x.revenue, x.expenses); }));
    var pad = (mx - mn) * 0.18 || mx * 0.1 || 1; mx += pad; mn = Math.max(0, mn - pad);
    var n = h.length, x = function (i) { return P.l + (n === 1 ? iw / 2 : (i / (n - 1)) * iw); };
    var y = function (v) { return P.t + ih - ((v - mn) / (mx - mn || 1)) * ih; };
    function path(key) { return h.map(function (d, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(d[key]).toFixed(1); }).join(' '); }
    /* Area under each line, closed along the baseline, for a soft fill. */
    function area(key) {
      return path(key) + ' L' + x(n - 1).toFixed(1) + ' ' + (P.t + ih) + ' L' + x(0).toFixed(1) + ' ' + (P.t + ih) + ' Z';
    }
    function dots(key, color) {
      return h.map(function (d, i) {
        return '<circle class="pt" cx="' + x(i).toFixed(1) + '" cy="' + y(d[key]).toFixed(1) + '" r="3.5" fill="#fff" stroke="' + color + '" stroke-width="2" style="animation-delay:' + (0.55 + i * 0.05).toFixed(2) + 's"/>';
      }).join('');
    }
    var grid = '', ticks = 3;
    for (var i = 0; i <= ticks; i++) {
      var yy = P.t + (ih / ticks) * i, mv = mx - ((mx - mn) / ticks) * i;
      grid += '<line x1="' + P.l + '" y1="' + yy.toFixed(1) + '" x2="' + (W - P.r) + '" y2="' + yy.toFixed(1) + '" stroke="#eaeff6"/>' +
        '<text x="' + (P.l - 9) + '" y="' + (yy + 3.5).toFixed(1) + '" text-anchor="end" font-size="10" fill="#8b9bb0">' + moneyShort(mv) + '</text>';
    }
    /* Real month names on the axis instead of P1, P2, P3. */
    var labels = h.map(function (d, i) {
      return '<text x="' + x(i).toFixed(1) + '" y="' + (P.t + ih + 17) + '" text-anchor="middle" font-size="10" fill="#8b9bb0">' + monthShort(d.date) + '</text>';
    }).join('');

    /* One invisible column per month captures hover and drives the tooltip. */
    var half = n > 1 ? (iw / (n - 1)) / 2 : iw / 2;
    var hot = h.map(function (d, i) {
      var cx = x(i), left = Math.max(P.l, cx - half), w = Math.min(W - P.r, cx + half) - left;
      var profit = d.revenue - d.expenses;
      var payload = [
        monthLabel(d.date), fmtDate(d.date),
        money(d.revenue), money(d.expenses),
        (profit >= 0 ? '+' : '−') + money(Math.abs(profit)), profit >= 0 ? 'up' : 'down',
        d.customers, d.status === 'on-time' ? 'Sent on time' : d.status === 'late' ? 'Sent late' : 'Not sent'
      ].join('||');
      return '<rect class="hot" x="' + left.toFixed(1) + '" y="' + P.t + '" width="' + Math.max(1, w).toFixed(1) + '" height="' + ih + '" fill="transparent" ' +
        'data-cx="' + cx.toFixed(1) + '" data-rev-y="' + y(d.revenue).toFixed(1) + '" data-exp-y="' + y(d.expenses).toFixed(1) + '" ' +
        'data-tip="' + esc(payload) + '"></rect>';
    }).join('');

    return '<div class="chart-wrap">' +
      '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' +
        '<defs>' +
          '<linearGradient id="gRev" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0%" stop-color="#1d5490" stop-opacity=".20"/><stop offset="100%" stop-color="#1d5490" stop-opacity="0"/></linearGradient>' +
          '<linearGradient id="gExp" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0%" stop-color="#c0322b" stop-opacity=".16"/><stop offset="100%" stop-color="#c0322b" stop-opacity="0"/></linearGradient>' +
        '</defs>' +
        grid + labels +
        '<path class="fill" d="' + area('revenue') + '" fill="url(#gRev)"/>' +
        '<path class="fill" d="' + area('expenses') + '" fill="url(#gExp)"/>' +
        '<line class="crosshair" id="chartCross" x1="0" y1="' + P.t + '" x2="0" y2="' + (P.t + ih) + '" stroke="#8b9bb0" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>' +
        '<path class="ln" d="' + path('revenue') + '" fill="none" stroke="#1d5490" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' +
        '<path class="ln" d="' + path('expenses') + '" fill="none" stroke="#c0322b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:.15s"/>' +
        dots('revenue', '#1d5490') + dots('expenses', '#c0322b') +
        '<circle class="marker" id="markRev" r="5" fill="#1d5490" stroke="#fff" stroke-width="2" opacity="0"/>' +
        '<circle class="marker" id="markExp" r="5" fill="#c0322b" stroke="#fff" stroke-width="2" opacity="0"/>' +
        hot +
      '</svg>' +
      '<div class="chart-tip" id="chartTip"></div>' +
      '<div class="chart-key">' +
        '<span><i style="background:#1d5490"></i>Money in</span>' +
        '<span><i style="background:#c0322b"></i>Money out</span>' +
        '<span class="hint">Hover any month for the detail</span>' +
      '</div></div>';
  }
  /* Donut of the health mix. Proportions are true, no perspective tilt, which
     would make equal slices read as unequal. Depth comes from a soft shadow and
     a gradient; the life comes from hover, where a slice lifts, brightens and
     tells you what it is. Slices are also a filter for the table below. */
  function donut(c) {
    var BANDS = [
      { k: 'green', v: c.green, col: '#12805c', lit: '#18a074', label: 'Healthy' },
      { k: 'yellow', v: c.yellow, col: '#a86a00', lit: '#c98505', label: 'Watch' },
      { k: 'red', v: c.red, col: '#c0322b', lit: '#dc4038', label: 'At risk' }
    ].filter(function (b) { return b.v > 0; });

    var total = c.green + c.yellow + c.red || 1;
    var CX = 96, CY = 92, R = 62, IR = 38, GAP = 1.6;

    function pt(cx, cy, r, deg) {
      var a = (deg - 90) * Math.PI / 180;
      return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    }
    /* Ring segment as a closed path, so it can be filled, lifted and glowed. */
    function arc(cx, cy, from, to, rOut, rIn) {
      var large = (to - from) > 180 ? 1 : 0;
      var a = pt(cx, cy, rOut, from), b = pt(cx, cy, rOut, to);
      var d = pt(cx, cy, rIn, to), e = pt(cx, cy, rIn, from);
      return 'M' + a[0].toFixed(2) + ' ' + a[1].toFixed(2) +
        ' A' + rOut + ' ' + rOut + ' 0 ' + large + ' 1 ' + b[0].toFixed(2) + ' ' + b[1].toFixed(2) +
        ' L' + d[0].toFixed(2) + ' ' + d[1].toFixed(2) +
        ' A' + rIn + ' ' + rIn + ' 0 ' + large + ' 0 ' + e[0].toFixed(2) + ' ' + e[1].toFixed(2) + ' Z';
    }

    var defs = '<defs>' +
      '<filter id="dShadow" x="-40%" y="-40%" width="180%" height="180%">' +
        '<feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0a2540" flood-opacity="0.20"/></filter>' +
      BANDS.map(function (b) {
        return '<filter id="glow-' + b.k + '" x="-50%" y="-50%" width="200%" height="200%">' +
          '<feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="' + b.col + '" flood-opacity="0.75"/></filter>' +
          '<linearGradient id="grad-' + b.k + '" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0%" stop-color="' + b.lit + '"/><stop offset="100%" stop-color="' + b.col + '"/></linearGradient>';
      }).join('') + '</defs>';

    var at = 0;
    var slices = BANDS.map(function (b) {
      var sweep = (b.v / total) * 360;
      var from = at + (BANDS.length > 1 ? GAP / 2 : 0);
      var to = at + sweep - (BANDS.length > 1 ? GAP / 2 : 0);
      var mid = at + sweep / 2;
      at += sweep;
      /* Direction the slice moves when hovered. */
      var off = pt(0, 0, 5, mid);
      return '<path class="dslice" d="' + arc(CX, CY, from, to, R, IR) + '" fill="url(#grad-' + b.k + ')" ' +
        'data-band="' + b.k + '" data-filter="' + b.k + '" ' +
        'data-label="' + esc(b.label) + '" data-count="' + b.v + '" ' +
        'style="--mx:' + off[0].toFixed(2) + 'px; --my:' + off[1].toFixed(2) + 'px; ' +
        'filter:url(#glow-' + b.k + ')"><title>' + esc(b.label) + ' · ' + b.v + '</title></path>';
    }).join('');

    return '<div class="donut-wrap">' +
      '<svg class="donut" viewBox="0 0 192 184" width="192" height="184" role="img" aria-label="Portfolio health mix">' +
      defs +
      '<circle cx="' + CX + '" cy="' + CY + '" r="' + ((R + IR) / 2) + '" fill="none" stroke="#eaeff6" ' +
        'stroke-width="' + (R - IR) + '" filter="url(#dShadow)"/>' +
      '<g class="dslices">' + slices + '</g>' +
      '<text class="dnum" x="' + CX + '" y="' + (CY - 2) + '" text-anchor="middle">' + total + '</text>' +
      '<text class="dlbl" x="' + CX + '" y="' + (CY + 15) + '" text-anchor="middle">businesses</text>' +
      '</svg></div>';
  }

  /* =========================================================================
     7. RENDER, LANDING
     ========================================================================= */
  function renderLanding() {
    /* Each journey step carries an icon that depicts the step itself: a coin for
       funding, an eye for visibility, and so on through to the upward badge for
       readiness. Inline SVG so there is no icon-font dependency. */
    var ICON = {
      funding:    '<circle cx="12" cy="12" r="8"/><path d="M12 8.5v7M10 10.5h3a1.5 1.5 0 0 1 0 3h-2a1.5 1.5 0 0 0 0 3h3"/>',
      visibility: '<path class="eye-outline" d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6Z"/><circle class="eye-pupil" cx="12" cy="12" r="2.6"/>',
      detection:  '<g class="alert"><path d="M12 3.6 21 19.2H3L12 3.6Z"/><path d="M12 10v4"/><path d="M12 16.6h.01"/></g>',
      guidance:   '<circle cx="12" cy="12" r="8.5"/><path class="needle" d="M15.2 8.8 13.4 13.4 8.8 15.2l1.8-4.6 4.6-1.8Z"/>',
      growth:     '<g class="trend"><path d="M3 17.5 9 11l4 4 7.2-7.6"/><path d="M15.6 7.4h4.8v4.8"/></g>',
      record:     '<path d="M6 3.5h9L19 7.5v13H6v-17Z"/><path d="M14.6 3.6v4.2h4.2"/><path class="tick" d="m9.2 14 2.1 2.1 4-4"/>',
      readiness:  '<circle cx="12" cy="9.4" r="5.4"/><path d="m9.6 8.9 1.7 1.7 3-3"/><path d="m8.7 14.6-1.3 6 4.6-2.4 4.6 2.4-1.3-6"/>'
    };
    var steps = [
      { key: 'funding',    label: 'Funding',                       icon: ICON.funding },
      { key: 'visibility', label: 'Visibility',                    icon: ICON.visibility },
      { key: 'detection',  label: 'Early Detection',               icon: ICON.detection },
      { key: 'guidance',   label: 'Guidance',                      icon: ICON.guidance },
      { key: 'growth',     label: 'Stronger Business Performance', icon: ICON.growth },
      { key: 'record',     label: 'Verified Track Record',         icon: ICON.record },
      { key: 'readiness',  label: 'Greater Financial Readiness',   icon: ICON.readiness }
    ];
    var stepsHtml = steps.map(function (s, i) {
      var svg = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
        'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + s.icon + '</svg>';
      var spark = s.key === 'readiness'
        ? '<span class="spark">' + '<i></i><i></i><i></i><i></i><i></i><i></i>' + '</span>' : '';
      return '<div class="step" data-step="' + s.key + '" tabindex="0">' +
          '<div class="dot">' + svg + spark + '<span class="no">' + (i + 1) + '</span></div>' +
          '<div class="lbl">' + s.label + '</div>' +
        '</div>' +
        (i < steps.length - 1 ? '<div class="arrow" aria-hidden="true">' +
          '<svg viewBox="0 0 34 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M1 6h27" stroke-dasharray="3 3"/><path d="m26.5 1.8 4.8 4.2-4.8 4.2"/>' +
          '</svg></div>' : '');
    }).join('');
    return '<div class="landing">' +
      '<a class="to-launch" href="/">Back to Home</a>' +
      '<div class="mark"><img src="assets/logo_only__1_-removebg-preview.png" alt="Proven logo" /></div>' +
      '<div class="brandname">PROVEN</div>' +
      '<div class="brandtag">Turning Potential into Proof</div>' +
      '<h1>We don’t just track where funding went.</h1>' +
      '<p class="tagline">We help determine whether the funding is helping build a sustainable business, and create the evidence to prove it.</p>' +
      '<div class="journey">' + stepsHtml + '</div>' +
      '<p class="twosided-line">Entrepreneurs see how to improve. Funders see whether improvement is happening.</p>' +
      '<div class="role-picks">' +
        '<button class="role-btn accent" data-enter="entrepreneur"><div class="rb-ico">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            '<path d="M3.6 9.4 5 4.6h14l1.4 4.8"/><path d="M4.6 9.4h14.8v9.8H4.6z"/><path d="M9.4 19.2v-5h5.2v5"/>' +
          '</svg></div><div class="rb-title">Enter as Entrepreneur</div><div class="rb-sub">Track your business health, understand your risk, and build a verified track record.</div></button>' +
        '<button class="role-btn" data-enter="funder"><div class="rb-ico">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            '<path d="M3.2 20.4h17.6"/><path d="M4.8 20.4v-6.2M9.6 20.4V9.4M14.4 20.4v-8.2M19.2 20.4V5.6"/>' +
            '<path d="m4.8 11.2 4.8-4.4 4.8 2.6 5.4-5.2"/><path d="M15.6 3.9h4.2v4.2"/>' +
          '</svg></div><div class="rb-title">Enter as Funder</div><div class="rb-sub">Monitor your full funded portfolio and see which businesses are ready for what’s next.</div></button>' +
      '</div>' +
      (loadSaved() ? '<div class="saved-note">Your earlier changes have been kept. ' +
        '<button id="resetDemo">Start the demo over</button></div>' : '') +
    '</div>';
  }

  /* =========================================================================
     8. RENDER, SHELL (sidebar + topbar)
     ========================================================================= */
  function renderShell(navItems, activeKey, title, sub, bodyHtml, showBizPicker) {
    var navHtml = navItems.map(function (it) {
      var active = activeKey === it.key;
      return '<button class="nav-item' + (active ? ' active' : '') + '" data-nav="' + it.key + '">' + it.label +
        (it.count !== undefined ? '<span class="count' + (it.alarm ? ' alarm' : '') + '">' + it.count + '</span>' : '') + '</button>';
    }).join('');
    var bizPicker = '';
    if (showBizPicker) {
      bizPicker = '<div class="biz-picker"><label>Viewing as</label><select id="bizPick">' +
        state.businesses.map(function (b) { return '<option value="' + b.id + '"' + (b.id === state.bizId ? ' selected' : '') + '>' + esc(b.name) + '</option>'; }).join('') +
        '</select></div>';
    }
    return '<div class="app"><aside class="sidebar">' +
      '<div class="brand"><div class="logo"><img class="mark" src="assets/logo_only__1_-removebg-preview.png" alt="Proven logo" /><h1>Proven</h1></div>' +
      '<div class="role-badge">' + (state.role === 'entrepreneur' ? 'Entrepreneur view' : 'Funder view') + '</div>' +
      '<div class="switch-role"><button data-nav="home">Switch role</button></div></div>' +
      bizPicker +
      '<nav class="nav">' + navHtml + '</nav>' +
      '<div class="sidebar-foot">Proven prototype<br/>Track &middot; Detect &middot; Guide &middot; Prove' +
        (loadSaved() ? '<button class="reset-inline" id="resetDemo">Reset the demo data</button>' : '') +
      '</div>' +
      '</aside><main class="main">' +
      '<div class="topbar"><div class="title"><h2>' + esc(title) + '</h2><p>' + esc(sub) + '</p></div><div class="spacer"></div></div>' +
      '<div class="view">' + bodyHtml + '</div>' +
      '</main></div>';
  }

  /* =========================================================================
     9. RENDER, ENTREPRENEUR VIEW
     ========================================================================= */
  function renderEntrepreneur() {
    var biz = byId(state.bizId);
    var navItems = [
      { key: 'overview', label: 'Overview' },
      { key: 'transactions', label: 'Transactions' },
      { key: 'milestones', label: 'Stages' },
      /* Only flag red when there is a real problem to act on, a healthy business
         still gets one "keep going" note, which should not look like an alert. */
      { key: 'recommendations', label: 'What to do next', count: getGuidance(biz).length,
        alarm: getGuidance(biz).some(function (g) { return g.sev === 'red' || g.sev === 'yellow'; }) },
      { key: 'history', label: 'Month by month' }
    ];
    var body =
      state.entTab === 'overview' ? entOverview(biz) :
      state.entTab === 'transactions' ? entTransactions(biz) :
      state.entTab === 'milestones' ? entMilestones(biz) :
      state.entTab === 'recommendations' ? entRecommendations(biz) : entHistory(biz);
    return renderShell(navItems, state.entTab, biz.name, biz.industry + ' · ' + biz.region, body, true);
  }

  /* Six months of score in a thumbnail, shows direction, which a single
     number cannot. Deliberately small: it supports the ring, not competes. */
  function scoreSpark(biz) {
    var pts = biz.history.map(function (_, i) { return healthAt(biz, i).score; }).slice(-6);
    if (pts.length < 2) return '';
    var W = 108, H = 30, mn = Math.min.apply(null, pts), mx = Math.max.apply(null, pts);
    var span = (mx - mn) || 1;
    var x = function (i) { return (i / (pts.length - 1)) * (W - 4) + 2; };
    var y = function (v) { return H - 3 - ((v - mn) / span) * (H - 8); };
    var d = pts.map(function (v, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); }).join(' ');
    var lastTier = tierOf(pts[pts.length - 1]);
    var col = lastTier === 'green' ? '#12805c' : lastTier === 'yellow' ? '#a86a00' : '#c0322b';
    return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" aria-hidden="true">' +
      '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<circle cx="' + x(pts.length - 1).toFixed(1) + '" cy="' + y(pts[pts.length - 1]).toFixed(1) + '" r="2.8" fill="' + col + '"/></svg>';
  }

  function scoreRingHtml(score, tier, label) {
