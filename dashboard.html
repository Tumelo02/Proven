    var color = tier === 'green' ? '#12805c' : tier === 'yellow' ? '#a86a00' : '#c0322b';
    var bg = tier === 'green' ? '#e3f6ee' : tier === 'yellow' ? '#fdf1dc' : '#fdeae8';
    return '<div class="ring" style="background:' + bg + '"><div><div class="n" style="color:' + color + '">' + score + '</div><div class="u">' + esc(label) + '</div></div></div>';
  }

  function entOverview(biz) {
    var h = computeHealth(biz), dec = decisionFor(biz), t = trendOf(biz), d = scoreDelta(biz);
    var util = fundingUtilisation(biz), guidance = getGuidance(biz), cr = creditReadiness(biz);
    var cash = biz.history[biz.history.length - 1].revenue - biz.history[biz.history.length - 1].expenses;
    var rep = reportingStatus(biz);
    /* Trends read better with a direction colour: rising sales and falling
       costs are good, the reverse is not. */
    var revTone = h.revGrowth > 0.005 ? 'var(--green)' : h.revGrowth < -0.005 ? 'var(--red)' : '';
    var expTone = h.expGrowth > h.revGrowth ? 'var(--red)' : 'var(--green)';
    var kpis = [
      { l: 'Sales trend', v: pct(h.revGrowth), foot: 'last 3 months vs the 3 before', tone: revTone },
      { l: 'Cost trend', v: pct(h.expGrowth), foot: 'last 3 months vs the 3 before', tone: expTone },
      { l: 'Money left over', v: cash >= 0 ? 'Positive' : 'Negative',
        foot: (cash >= 0 ? 'You kept ' : 'You were short ') + money(Math.abs(cash)) + ' last month',
        tone: cash >= 0 ? 'var(--green)' : 'var(--red)' },
      { l: 'Funding used', v: util + '%', foot: 'of the ' + money(biz.fundingAmount) + ' received' }
    ];
    return '<div class="panel score-hero" style="margin-bottom:16px">' + scoreRingHtml(h.score, h.tier, 'SCORE') +
      '<div style="flex:1;min-width:220px"><span class="chip ' + h.tier + '"><span class="dot"></span>' + tierLabel(h.tier) + '</span>' +
      '<div style="margin-top:8px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:12px;flex-wrap:wrap">' +
        '<span>Trend <span class="trend ' + t + '">' + trendGlyph(t) + ' ' + (d > 0 ? '+' : '') + d.toFixed(1) + '</span> vs last month</span>' +
        scoreSpark(biz) + '<span class="tiny muted">last 6 months</span></div>' +
      '<div style="margin-top:10px"><div class="tiny muted">Progress through the stages</div><div class="progress-track" style="margin-top:5px"><i style="width:' + milestoneProgress(biz) + '%"></i></div>' +
      '<div class="tiny muted" style="margin-top:5px">' + currentMilestone(biz) + ' &middot; ' + milestoneProgress(biz) + '% complete</div></div></div>' +

      /* Credit readiness sits beside the score, so what the record is earning is
         visible without scrolling, it is the entrepreneur's reason to keep going. */
      '<div class="cr-side ' + cr.color + '">' +
        '<div class="crs-label">Credit readiness</div>' +
        '<div class="crs-status">' + esc(cr.status) + '</div>' +
        '<div class="crs-plain">' + esc(cr.plain) + '</div>' +
        '<div class="crs-dots">' + CR_BANDS.map(function (b, i) {
          var reached = i <= CR_BANDS.indexOf(cr.status);
          return '<span class="crs-dot' + (reached ? ' on' : '') + '" title="' + esc(b) + '"></span>';
        }).join('') + '<span class="crs-of">' + (CR_BANDS.indexOf(cr.status) + 1) + ' of 4</span></div>' +
      '</div></div>' +

      '<div class="kpis">' + kpis.map(function (k) {
        return '<div class="kpi"><div class="label">' + k.l + '</div>' +
          '<div class="value"' + (k.tone ? ' style="color:' + k.tone + '"' : '') + '>' + k.v + '</div>' +
          '<div class="foot">' + k.foot + '</div></div>';
      }).join('') + '</div>' +

      /* Where this business stands in its reporting cycle, stated plainly. */
      '<div class="duebar ' + rep.state + '">' +
        '<span class="dueicon">' +
          (rep.sent
            ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>'
            : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
              '<rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>') +
        '</span>' +
        '<div><div class="duetitle">' + esc(rep.title) + '</div>' +
        '<div class="duesub">' + esc(rep.detail) + '</div></div>' +
        (rep.state === 'ok' || rep.sent ? '' : '<button class="btn sm duebtn" data-nav="transactions">Send update</button>') +
      '</div>' +

      '<div class="grid2">' +
        '<div class="panel"><div class="panel-head"><h3>Where you stand</h3><span class="hint" style="margin-left:auto">What a funder would see right now</span></div><div class="panel-body">' +
          '<div class="decision ' + dec.kind + '"><div class="glyph">' + (dec.kind === 'release' ? '✔' : dec.kind === 'hold' ? '⏸' : '⚠') + '</div>' +
          '<div><div class="lbl">Status</div><div class="act">' + esc(dec.action) + '</div><div class="why">' + esc(dec.why) + '</div></div></div></div></div>' +
        '<div class="panel"><div class="panel-head"><h3>Do this first</h3></div><div class="panel-body">' +
          guidance.slice(0, 1).map(recCardHtml).join('') +
          '<button class="btn ghost sm" style="margin-top:10px" data-nav="recommendations">See all recommendations</button></div></div>' +
      '</div>';
  }

  function recCardHtml(g) {
    return '<div class="rec-card ' + g.sev + '"><div class="issue">' + esc(g.issue) + '</div><div class="rec"><b>Try this:</b> ' + esc(g.rec) + '</div></div>';
  }
  function entRecommendations(biz) {
    return '<div class="panel"><div class="panel-head"><h3>What to do next</h3><span class="hint" style="margin-left:auto">Based on how your business is doing right now</span></div>' +
      '<div class="panel-body">' + getGuidance(biz).map(recCardHtml).join('') + '</div></div>';
  }

  function entMilestones(biz) {
    var rows = biz.milestones.map(function (m, i) {
      var actions = '';
      if (m.status === 'current' || m.status === 'delayed') {
        actions = '<div class="mactions"><button class="btn sm" data-milestone-action="complete" data-idx="' + i + '">Mark complete</button>' +
          '<button class="btn ghost sm" data-milestone-action="delay" data-idx="' + i + '">Mark delayed</button></div>';
      }
      return '<div class="milestone-row ' + m.status + '"><div class="mnum">' + (m.status === 'done' ? '✔' : (i + 1)) + '</div>' +
        '<div class="mlabel">' + esc(m.label) + '<div class="tiny muted" style="font-weight:500">' + (m.status === 'done' ? 'Completed' : m.status === 'delayed' ? 'Running late' : m.status === 'current' ? 'Working on it now' : 'Not started yet') + '</div></div>' + actions + '</div>';
    }).join('');
    return '<div class="panel"><div class="panel-head"><h3>Stages</h3><span class="hint" style="margin-left:auto">' + milestoneProgress(biz) + '% complete</span></div><div class="panel-body">' + rows + '</div></div>';
  }

  /* Share of transaction value that carries an attached document. */
  /* Every entry needs backing, income included, a sales total is exactly the
     figure a funder would most want evidence for, so income carries a till
     summary or deposit slip just as spending carries a receipt. */
  function evidenceCoverage(biz) {
    var total = 0, backed = 0, n = 0, withProof = 0;
    biz.ledger.forEach(function (t, i) {
      total += t.amount; n++;
      if (proofIndex[txnRef(t, i)]) { backed += t.amount; withProof++; }
    });
    return {
      pct: total > 0 ? Math.round(backed / total * 100) : 0,
      backed: backed, total: total, count: n, withProof: withProof
    };
  }

  function entTransactions(biz) {
    var draft = draftFor(biz.id);
    var cov = evidenceCoverage(biz);
    var covTone = cov.pct >= 70 ? 'var(--green)' : cov.pct >= 40 ? 'var(--yellow)' : 'var(--red)';

    var rows = biz.ledger.map(function (t, i) { return { t: t, ref: txnRef(t, i) }; })
      .reverse().slice(0, 12).map(function (o) {
      var t = o.t, p = proofIndex[o.ref];
      var proofCell = p
        ? '<button class="proof-chip has" data-proof-view="' + esc(o.ref) + '" title="' + esc(p.name) + '">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>' +
            'Attached</button>'
        : '<label class="proof-chip add"><input type="file" accept="image/*,.pdf" data-proof-for="' + esc(o.ref) + '" hidden />' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>' +
            'Attach</label>';
      return '<tr><td>' + monthShort(t.date) + '<div class="tiny muted">' + fmtDateShort(t.date) + '</div></td><td>' + esc(t.desc) + '</td><td>' + esc(t.category) + '</td>' +
        '<td style="color:' + (t.type === 'revenue' ? 'var(--green)' : 'var(--ink)') + '">' + (t.type === 'revenue' ? '+' : '−') + money(t.amount) + '</td>' +
        '<td>' + proofCell + '</td></tr>';
    }).join('');

    var coveragePanel = '<div class="panel" style="margin-bottom:16px"><div class="panel-body">' +
      '<div class="cov-head"><div><div class="cov-title">Evidence coverage</div>' +
      '<div class="tiny muted">' + money(cov.backed) + ' of ' + money(cov.total) + ' backed by a document · ' + cov.withProof + ' of ' + cov.count + ' entries</div></div>' +
      '<div class="cov-pct" style="color:' + covTone + '">' + cov.pct + '%</div></div>' +
      '<div class="cov-bar"><span style="width:' + cov.pct + '%;background:' + covTone + '"></span></div>' +
      '<div class="cov-note">This is the share of <b>everything you log</b>, money in and money out, that has a document behind it. Sales need a till summary or deposit slip; costs need a receipt or invoice. ' +
      'Documents stay on this device and are marked <b>pending review</b> until a funder opens them.</div>' +
      '</div></div>';
    var catOptions = EXP_CATEGORIES.map(function (c) { return '<option value="' + c + '">' + c + '</option>'; }).join('');
    return coveragePanel +
      '<div class="panel" style="margin-bottom:16px"><div class="panel-head"><h3>Add a transaction</h3><span class="hint" style="margin-left:auto">Builds this period’s numbers below</span></div>' +
      '<div class="panel-body"><div class="txn-form">' +
        '<div class="f"><label>Description</label><input id="txnDesc" type="text" placeholder="e.g. Weekly stock order" /></div>' +
        '<div class="f"><label>Type</label><select id="txnType"><option value="revenue">Revenue</option><option value="expense">Expense</option></select></div>' +
        '<div class="f"><label>Category</label><select id="txnCat"><option value="Sales">Sales</option>' + catOptions + '</select></div>' +
        '<div class="f"><label>Amount (R)</label><input id="txnAmt" type="number" min="0" placeholder="0" /></div>' +
        '<button class="btn" id="addTxnBtn">Add</button>' +
      '</div>' +
      '<div class="txn-proof"><label class="proof-pick"><input type="file" id="txnProof" accept="image/*,.pdf" hidden />' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M12 16V4"/><path d="m7.5 8.5 4.5-4.5 4.5 4.5"/><path d="M4 16v3.2h16V16"/></svg>' +
        '<span id="txnProofLabel">Attach receipt or invoice</span></label>' +
        '<span class="tiny muted">Optional, you can also attach it later from the table below.</span></div>' +
      '</div></div>' +

      '<div class="panel" style="margin-bottom:16px"><div class="panel-head"><h3>Send this month&rsquo;s numbers</h3>' +
      '<span class="hint" style="margin-left:auto">Due ' + fmtDate(reportingStatus(biz).due) + ' &middot; ' + reportingStatus(biz).label + '</span></div><div class="panel-body">' +
        /* Totals of what has been added but not yet submitted. Shown only once
           there is something in them, three zeros on arrival explained nothing
           and sat in the wrong panel. */
        (draft.revenue || draft.expenses
          ? '<div class="draft-summary">' +
              '<div class="d"><div class="l">Money in this month</div><div class="v" style="color:var(--green)">' + money(draft.revenue) + '</div></div>' +
              '<div class="d"><div class="l">Money out this month</div><div class="v" style="color:var(--red)">' + money(draft.expenses) + '</div></div>' +
              '<div class="d"><div class="l">Left over</div><div class="v" style="color:' + (draft.revenue - draft.expenses >= 0 ? 'var(--green)' : 'var(--red)') + '">' +
                (draft.revenue - draft.expenses < 0 ? '−' : '') + money(Math.abs(draft.revenue - draft.expenses)) + '</div></div>' +
              '<div class="draft-hint">From the transactions you have added. Submitting turns them into a finished month.</div>' +
            '</div>'
          : '') +
        '<div class="txn-form" style="grid-template-columns:1fr 1fr 1fr auto">' +
        '<div class="f"><label>Customers this period</label><input id="submitCust" type="number" min="0" value="' + biz.history[biz.history.length - 1].customers + '" /></div>' +
        '<div class="f"><label>Stage update</label><select id="submitMilestone"><option value="unchanged">No change</option><option value="complete">Finished this stage</option><option value="delayed">Running late on this stage</option></select></div>' +
        '<div class="f"><label>Short status update</label><input id="submitNote" type="text" placeholder="What happened this month?" /></div>' +
        '<button class="btn" id="submitPeriodBtn">Submit update</button></div>' +
        /* The deck describes WhatsApp as the entrepreneur's real check-in
           channel. Naming it here keeps the prototype honest about what this
           form stands in for. */
        '<div class="wa-note">' +
          '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
            '<path d="M12 2a10 10 0 0 0-8.6 15l-1.3 4.8 5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.4-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.6 0a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.6-1.2a.4.4 0 0 0 0-.4c0-.1-.6-1.4-.8-1.9s-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.1.7a2.6 2.6 0 0 0 1.7-1.2 2.1 2.1 0 0 0 .2-1.2c-.1-.1-.3-.2-.5-.3Z"/>' +
          '</svg>' +
          '<span>In production, entrepreneurs send this by <b>WhatsApp</b>, no app download, low data. ' +
          'This form stands in for that check-in.</span>' +
        '</div>' +
        '<button class="btn ghost sm" id="quickDemoBtn" style="margin-top:12px">Quick demo: log a rough month</button>' +
      '</div></div>' +

      '<div class="panel"><div class="panel-head"><h3>Recent transactions</h3><span class="hint" style="margin-left:auto">Attach a document to any entry</span></div>' +
      '<table><thead><tr><th>Month</th><th>Description</th><th>Category</th><th>Amount</th><th>Proof</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function entHistory(biz) {
    var hist = biz.history;
    var rows = hist.slice().reverse().map(function (p, ri) {
      var idx = hist.length - 1 - ri, hh = healthAt(biz, idx);
      var prev = idx > 0 ? hist[idx - 1] : null;
      var left = p.revenue - p.expenses;
      /* Change against the month before, so a trend is visible without maths. */
      var delta = '';
      if (prev) {
        var dv = prev.revenue ? (p.revenue - prev.revenue) / prev.revenue : 0;
        var dir = dv > 0.005 ? 'up' : dv < -0.005 ? 'down' : 'flat';
        delta = '<span class="mchange ' + dir + '">' + (dir === 'up' ? '▲' : dir === 'down' ? '▼' : '■') + ' ' +
          (dv >= 0 ? '+' : '') + (dv * 100).toFixed(0) + '%</span>';
      } else {
        delta = '<span class="mchange flat">first month</span>';
      }
      var statusLabel = p.status === 'on-time' ? 'On time' : p.status === 'late' ? 'Late' : 'Not sent';
      return '<tr class="mrow" title="' + esc(monthLabel(p.date) + ', sent ' + statusLabel.toLowerCase() + ' on ' + fmtDate(p.date)) + '">' +
        '<td><b>' + monthLabel(p.date) + '</b><div class="tiny muted">' + fmtDate(p.date) + '</div></td>' +
        '<td class="mono">' + moneyShort(p.revenue) + '<div class="tiny">' + delta + '</div></td>' +
        '<td class="mono">' + moneyShort(p.expenses) + '</td>' +
        '<td class="mono" style="color:' + (left >= 0 ? 'var(--green)' : 'var(--red)') + '">' + (left >= 0 ? '+' : '−') + moneyShort(Math.abs(left)) + '</td>' +
        '<td class="mono">' + p.customers + '</td>' +
        '<td><span class="chip ' + hh.tier + '">' + hh.score + '</span></td>' +
        '<td><span class="stat-pill ' + p.status + '">' + statusLabel + '</span></td></tr>';
    }).join('');

    var notes = biz.notes.slice().reverse().map(function (n) {
      return '<li><div class="t-title">' + esc(n.title) + '</div><div class="t-detail">' + esc(n.detail) + '</div><div class="t-date">' + fmtDate(n.date) + '</div></li>';
    }).join('') || '<li><div class="t-detail">You have not sent any updates yet.</div></li>';

    /* Plain-language summary of how the money has been used overall. */
    var totIn = hist.reduce(function (s, p) { return s + p.revenue; }, 0);
    var totOut = hist.reduce(function (s, p) { return s + p.expenses; }, 0);
    var kept = totIn - totOut;
    var best = hist.reduce(function (a, b) { return b.revenue > a.revenue ? b : a; }, hist[0]);
    var summary = '<div class="msum">' +
      '<div class="ms"><div class="l">Money in, all months</div><div class="v" style="color:var(--green)">' + money(totIn) + '</div></div>' +
      '<div class="ms"><div class="l">Money out, all months</div><div class="v">' + money(totOut) + '</div></div>' +
      '<div class="ms"><div class="l">' + (kept >= 0 ? 'Kept after costs' : 'Short after costs') + '</div>' +
        '<div class="v" style="color:' + (kept >= 0 ? 'var(--green)' : 'var(--red)') + '">' + (kept >= 0 ? '' : '−') + money(Math.abs(kept)) + '</div></div>' +
      '<div class="ms"><div class="l">Best month</div><div class="v">' + monthShort(best.date) + '</div>' +
        '<div class="tiny muted">' + money(best.revenue) + ' in</div></div>' +
      '</div>';

    return '<div class="panel" style="margin-bottom:16px"><div class="panel-head"><h3>Money in and money out</h3>' +
      '<span class="hint" style="margin-left:auto">Last ' + Math.min(hist.length, 8) + ' months</span></div>' +
      '<div class="panel-body">' + summary + lineChart(biz) + '</div></div>' +
      '<div class="grid2"><div class="panel"><div class="panel-head"><h3>Month-by-month record</h3>' +
      '<span class="hint" style="margin-left:auto">Newest first</span></div>' +
      '<table><thead><tr><th>Month</th><th>Money in</th><th>Money out</th><th>Left over</th><th>Customers</th><th>Score</th><th>Update</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="panel"><div class="panel-head"><h3>Your updates</h3></div><div class="panel-body"><ul class="tl">' + notes + '</ul></div></div></div>';
  }

  /* =========================================================================
     10. RENDER, FUNDER VIEW
     ========================================================================= */
  function renderFunder() {
    /* Businesses that are flagged and not yet followed up, the count a funder
       is actually working through. */
    var open = state.businesses.filter(function (b) {
      return computeHealth(b).tier !== 'green' && !b.actioned;
    }).length;
    var navItems = [
      { key: 'portfolio', label: 'Portfolio' },
      { key: 'attention', label: 'Needs attention', count: open, alarm: open > 0 }
    ];

    var view = state.funderView;
    var body, title, sub, active;
    if (view === 'profile') {
      body = businessProfile(byId(state.profileId), state.profileReturn || 'funder');
      title = byId(state.profileId).name;
      sub = 'Full performance record';
      active = state.profileReturn === 'attention' ? 'attention' : 'portfolio';
    } else if (view === 'attention') {
      body = funderAttention();
      title = 'Needs attention';
      sub = 'Everything flagged right now, with the reason and what the owner was told';
      active = 'attention';
    } else {
      body = funderPortfolio();
      title = 'Portfolio Overview';
      sub = 'Worst first, so problems reach you, the same score the entrepreneur sees';
      active = 'portfolio';
    }
    return renderShell(navItems, active, title, sub, body, false);
  }

  /* Triage screen: one card per flagged business carrying the reason, the
     advice the owner already received, and the follow-up action, so a funder
     can work the list without opening every profile in turn. */
  function funderAttention() {
    var flagged = state.businesses.filter(function (b) { return computeHealth(b).tier !== 'green'; })
      .sort(function (a, b) { return computeHealth(a).score - computeHealth(b).score; });

    if (!flagged.length) {
      return '<div class="panel"><div class="panel-body"><div class="empty">' +
        '<div class="big">&#10003;</div>Nothing needs attention right now. Every business is in the healthy band.' +
        '</div></div></div>';
    }

    var cards = flagged.map(function (b) {
      var h = computeHealth(b), rep = reportingStatus(b), g = getGuidance(b);
      var top = g[0] || {};
      var reasons = g.slice(0, 2).map(function (x) {
        return '<li class="' + x.sev + '"><b>' + esc(x.issue) + '</b><span>' + esc(x.rec) + '</span></li>';
      }).join('');
      return '<div class="att-card ' + h.tier + '">' +
        '<div class="att-head">' +
          '<div class="avatar">' + initials(b.name) + '</div>' +
          '<div class="att-who"><div class="nm" data-biz-att="' + b.id + '">' + esc(b.name) + '</div>' +
            '<div class="tiny muted">' + esc(b.owner) + ' &middot; ' + esc(b.industry) + '</div></div>' +
          '<div class="att-score"><span class="scorenum ' + h.tier + '">' + h.score + '</span>' +
            '<span class="chip ' + h.tier + '"><span class="dot"></span>' + tierLabel(h.tier) + '</span></div>' +
        '</div>' +
        '<ul class="att-why">' + reasons + '</ul>' +
        '<div class="att-foot">' +
          '<span class="due-pill ' + rep.state + '">' + esc(rep.label) + '</span>' +
          '<span class="tiny muted">' + money(b.fundingAmount) + ' granted &middot; ' + fundingUtilisation(b) + '% released</span>' +
          (b.actioned
            ? '<span class="att-done">&#10003; Followed up ' + fmtDate(b.actioned) + '</span>'
            : '<button class="btn sm" data-att-action="' + b.id + '">Mark followed up</button>') +
          '<button class="btn ghost sm" data-biz-att="' + b.id + '">Open record</button>' +
        '</div></div>';
    }).join('');

    return '<div class="att-list">' + cards + '</div>';
  }

  function funderPortfolio() {
    var c = counts(), total = state.businesses.length;
    var totalFunding = state.businesses.reduce(function (s, b) { return s + b.fundingAmount; }, 0);
    var avgUtil = Math.round(state.businesses.reduce(function (s, b) { return s + fundingUtilisation(b); }, 0) / total);
    var avgScore = Math.round(state.businesses.reduce(function (s, b) { return s + computeHealth(b).score; }, 0) / total);
    var needAttention = c.red + c.yellow;
    var overdue = state.businesses.filter(function (b) { return reportingStatus(b).state === 'overdue'; }).length;
    var rows = visibleBusinesses();

    /* The portfolio's direction answers "is this working?", a single score
       cannot. */
    var prevScores = state.businesses.map(function (b) {
      return b.history.length > 1 ? healthAt(b, b.history.length - 2).score : computeHealth(b).score;
    });
    var prevAvg = Math.round(prevScores.reduce(function (s, v) { return s + v; }, 0) / total);
    var trendDelta = avgScore - prevAvg;
    var trendDir = trendDelta > 0 ? 'up' : trendDelta < 0 ? 'down' : 'flat';

    /* Three figures, not seven. The counts per band are already shown by the
       filter tabs and the chart beside the table, so repeating them here only
       pushed the business list further down the page. */
    return '<div class="kpis k4">' +
        '<button class="kpi act' + (needAttention ? ' alarm' : '') + '" data-filter="' + (c.red ? 'red' : 'yellow') + '">' +
          '<div class="label">Needs attention</div><div class="value">' + needAttention + '</div>' +
          '<div class="foot">' + c.red + ' at risk · ' + c.yellow + ' on watch' + (overdue ? ' · ' + overdue + ' behind on updates' : '') + '</div></button>' +
        '<div class="kpi"><div class="label">Portfolio health</div>' +
          '<div class="value">' + avgScore + '/100 <span class="trend ' + trendDir + '" style="font-size:13px">' +
            trendGlyph(trendDir) + ' ' + (trendDelta > 0 ? '+' : '') + trendDelta + '</span></div>' +
          '<div class="foot">average score · ' + (trendDelta === 0 ? 'unchanged' : (trendDelta > 0 ? 'up' : 'down') + ' since last month') + '</div></div>' +
        '<div class="kpi"><div class="label">Evidence coverage</div>' +
          '<div class="value">' + (portfolioCoverage === null ? '-' : portfolioCoverage + '%') + '</div>' +
          '<div class="foot">of logged value backed by a document</div></div>' +
        '<div class="kpi"><div class="label">Funding at work</div><div class="value">' + moneyShort(totalFunding) + '</div>' +
          '<div class="foot">' + avgUtil + '% released against stages reached</div></div>' +
      '</div>' +

      '<div class="toolbar"><div class="seg">' + ['all', 'green', 'yellow', 'red'].map(function (t) { var n = t === 'all' ? total : c[t]; return '<button data-filter="' + t + '" class="' + (state.filterTier === t ? 'on' : '') + '">' + (t === 'all' ? 'All' : tierLabel(t)) + ' (' + n + ')</button>'; }).join('') + '</div>' +
      '<div class="field"><label>Search</label><input id="q" type="text" placeholder="Business, industry or owner…" value="' + esc(state.query) + '" /></div>' +
      '<div class="field"><label>Sort</label><select id="sortSel">' + [['score', 'Health score (worst first)'], ['name', 'Name'], ['industry', 'Industry'], ['funding', 'Funding amount']].map(function (o) { return '<option value="' + o[0] + '"' + (state.sortKey === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></div>' +
      '<div class="exports">' +
        '<button class="btn ghost sm" id="exportExcel">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M12 3.5v11"/><path d="m7.5 10 4.5 4.5 4.5-4.5"/><path d="M4 16.5v4h16v-4"/></svg>Excel</button>' +
        '<button class="btn ghost sm" id="exportPdf">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M12 3.5v11"/><path d="m7.5 10 4.5 4.5 4.5-4.5"/><path d="M4 16.5v4h16v-4"/></svg>PDF</button>' +
      '</div></div>' +

      '<div class="panel"><table><thead><tr><th>Business</th><th>Funding</th><th>Stage</th><th>Score</th><th>How it&rsquo;s doing</th><th class="hide-sm">Sales trend</th><th>Reporting</th><th>Credit readiness</th></tr></thead><tbody>' +
      (rows.length ? rows.map(portfolioRow).join('') : '<tr><td colspan="8"><div class="empty"><div class="big">&#9679;</div>No businesses match this filter.</div></td></tr>') + '</tbody></table></div>' +

      /* The mix chart and the positioning note sit below the list, where they
         give context without delaying the thing a funder came to see. */
      '<div class="grid2" style="margin-top:16px">' +
        '<div class="panel"><div class="panel-head"><h3>How your businesses are doing</h3>' +
          '<span class="hint" style="margin-left:auto">' +
            (c.red || c.yellow
              ? (c.red + c.yellow) + ' of ' + total + ' need a closer look'
              : 'All ' + total + ' in the healthy band') + '</span></div>' +
        '<div class="panel-body" style="display:flex;align-items:center;gap:24px;flex-wrap:wrap">' + donut(c) +
          '<div style="flex:1;min-width:170px">' +
            '<div class="mix-legend">' +
              [['green', 'Healthy', c.green, '#12805c', 'score 80-100'],
               ['yellow', 'Watch', c.yellow, '#a86a00', 'score 50-79'],
               ['red', 'At risk', c.red, '#c0322b', 'below 50']].map(function (b) {
                return '<button data-band-btn="' + b[0] + '" data-filter="' + b[0] + '"' +
                  (state.filterTier === b[0] ? ' class="on"' : '') + '>' +
                  '<i style="background:' + b[3] + '"></i>' + b[1] +
                  '<span class="n">' + b[2] + '</span></button>';
              }).join('') +
            '</div>' +
            '<div class="mix-hint">Hover a band to highlight it, click to filter the list.</div>' +
          '</div></div></div>' +
        '<div class="panel"><div class="panel-head"><h3>What this means</h3></div>' +
        '<div class="panel-body" style="font-size:12.5px;color:var(--muted);line-height:1.7">Businesses on Watch or At Risk are flagged so support can reach them early. The same score, the same explanation and the same recommendation are visible to the entrepreneur, this is a shared evidence platform, not a surveillance tool.</div></div>' +
      '</div>';
  }

  function visibleBusinesses() {
    var q = state.query.trim().toLowerCase();
    var list = state.businesses.filter(function (b) {
      if (state.filterTier !== 'all' && computeHealth(b).tier !== state.filterTier) return false;
      if (q && (b.name + ' ' + b.industry + ' ' + b.owner).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    list.sort(function (a, b) {
      if (state.sortKey === 'name') return a.name.localeCompare(b.name);
      if (state.sortKey === 'industry') return a.industry.localeCompare(b.industry);
      if (state.sortKey === 'funding') return b.fundingAmount - a.fundingAmount;
      return computeHealth(a).score - computeHealth(b).score;
    });
    return list;
  }

  /* Portfolio as a spreadsheet, so a funder can report upward without
     retyping. Built from the same figures shown on screen. */
  /* Coverage for every business, not just the one on screen. proofIndex holds
     a single business, so the export loads each in turn first. */
  function allCoverage() {
    if (!ProofStore.available()) return Promise.resolve({});
    return Promise.all(state.businesses.map(function (b) {
      return ProofStore.listFor(b.id).then(function (map) {
        var total = 0, backed = 0;
        b.ledger.forEach(function (t, i) {
          total += t.amount;
          if (map[txnRef(t, i)]) backed += t.amount;
        });
        return { id: b.id, pct: total > 0 ? Math.round(backed / total * 100) : 0 };
      });
    })).then(function (list) {
      var out = {};
      list.forEach(function (r) { out[r.id] = r.pct; });
      return out;
    }).catch(function () { return {}; });
  }

  /* Portfolio as a formatted workbook. SpreadsheetML is XML that Excel opens
     natively, it carries fonts, fills, column widths, number formats and a
     frozen header, none of which plain CSV can. It cannot hold images, so the
     branding is a typographic title block; the PDF export carries the logo. */
  function portfolioRows(covMap) {
    return state.businesses.slice().sort(function (a, b) {
      return computeHealth(a).score - computeHealth(b).score;
    }).map(function (b) {
      var h = computeHealth(b), cr = creditReadiness(b), rep = reportingStatus(b);
      return {
        biz: b, name: b.name, owner: b.owner, industry: b.industry, region: b.region,
        grant: b.fundingAmount, released: fundingUtilisation(b),
        score: h.score, tier: h.tier, band: tierLabel(h.tier), readiness: cr.status,
        reporting: rep.label, reportState: rep.state,
        coverage: covMap && covMap[b.id] != null ? covMap[b.id] : 0,
        jobs: (b.team && b.team.staff ? b.team.staff : 0) + 1,
        months: b.history.length,
        followedUp: b.actioned ? fmtDate(b.actioned) : ''
      };
    });
  }

  function xmlEsc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c];
    });
  }

  function exportExcel(covMap) {
    var rows = portfolioRows(covMap);
    var c = counts(), total = state.businesses.length;
    var totalFunding = state.businesses.reduce(function (s, b) { return s + b.fundingAmount; }, 0);
    var jobs = rows.reduce(function (s, r) { return s + r.jobs; }, 0);
    var avgScore = Math.round(state.businesses.reduce(function (s, b) { return s + computeHealth(b).score; }, 0) / total);

    var COLS = [
      { w: 190, k: 'name' }, { w: 130, k: 'owner' }, { w: 120, k: 'industry' }, { w: 110, k: 'region' },
      { w: 90, k: 'grant', money: true }, { w: 70, k: 'released', num: true },
      { w: 60, k: 'score', num: true }, { w: 70, k: 'band', band: true },
      { w: 150, k: 'readiness' }, { w: 100, k: 'reporting' },
      { w: 90, k: 'coverage', num: true }, { w: 70, k: 'jobs', num: true },
      { w: 80, k: 'months', num: true }, { w: 100, k: 'followedUp' }
    ];
    var HEAD = ['Business', 'Owner', 'Industry', 'Region', 'Grant', 'Released %', 'Score',
                'Band', 'Credit readiness', 'Reporting', 'Evidence %', 'Jobs', 'Months', 'Followed up'];

    function cell(v, style, type) {
      return '<Cell' + (style ? ' ss:StyleID="' + style + '"' : '') + '>' +
        '<Data ss:Type="' + (type || 'String') + '">' + xmlEsc(v) + '</Data></Cell>';
    }
    function spacer() { return '<Row/>'; }

    var xml = '<?xml version="1.0"?>\n<?mso-application progid="Excel.Sheet"?>\n' +
      '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" ' +
      'xmlns:o="urn:schemas-microsoft-com:office:office" ' +
      'xmlns:x="urn:schemas-microsoft-com:office:excel" ' +
      'xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">' +
      '<DocumentProperties xmlns="urn:schemas-microsoft-com:office:office">' +
        '<Title>Proven, Portfolio Report</Title><Company>Proven</Company></DocumentProperties>' +
      '<Styles>' +
        '<Style ss:ID="Default"><Font ss:FontName="Calibri" ss:Size="11" ss:Color="#0A2540"/>' +
          '<Alignment ss:Vertical="Center"/></Style>' +
        '<Style ss:ID="title"><Font ss:FontName="Calibri" ss:Size="20" ss:Bold="1" ss:Color="#0A2540"/>' +
          '<Alignment ss:Vertical="Center"/></Style>' +
        '<Style ss:ID="tagline"><Font ss:FontName="Calibri" ss:Size="11" ss:Italic="1" ss:Color="#0B7C8C"/></Style>' +
        '<Style ss:ID="meta"><Font ss:FontName="Calibri" ss:Size="10" ss:Color="#5D6F88"/></Style>' +
        '<Style ss:ID="section"><Font ss:FontName="Calibri" ss:Size="11" ss:Bold="1" ss:Color="#FFFFFF"/>' +
          '<Interior ss:Color="#0A2540" ss:Pattern="Solid"/><Alignment ss:Vertical="Center"/></Style>' +
        '<Style ss:ID="sumlbl"><Font ss:Bold="1" ss:Color="#5D6F88" ss:Size="10"/></Style>' +
        '<Style ss:ID="sumval"><Font ss:Bold="1" ss:Size="12" ss:Color="#0A2540"/></Style>' +
        '<Style ss:ID="summoney"><Font ss:Bold="1" ss:Size="12" ss:Color="#0A2540"/>' +
          '<NumberFormat ss:Format="&quot;R&quot;#,##0"/></Style>' +
        '<Style ss:ID="hdr"><Font ss:Bold="1" ss:Color="#FFFFFF" ss:Size="10"/>' +
          '<Interior ss:Color="#123A63" ss:Pattern="Solid"/>' +
          '<Alignment ss:Vertical="Center" ss:WrapText="1"/>' +
          '<Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#0A2540"/></Borders></Style>' +
        '<Style ss:ID="td"><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#DDE5F0"/></Borders></Style>' +

  /* =========================================================================
     PDF WRITER, builds a real .pdf by hand
     -------------------------------------------------------------------------
     No library is available offline, so the file is assembled directly. It
     uses the standard Helvetica faces (which need no embedding) and draws the
     logo as an uncompressed RGB image, the one image form a PDF accepts
     without a deflate implementation.
     ========================================================================= */
  var PDF = (function () {
    var PT = { w: 842, h: 595 };            /* A4 landscape, in points */
    var FONTS = { n: '/F1', b: '/F2', i: '/F3' };

    /* Width of a string in Helvetica, needed to right-align and to trim text
       that would otherwise run into the next column. */
    var WID = (function () {
      /* Helvetica advance widths per 1000 units, ASCII 32..126. */
      var w = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,
        556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,
        1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,
        667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,
        333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,
        556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
      return function (s, size, bold) {
        var t = 0;
        for (var i = 0; i < s.length; i++) {
          var c = s.charCodeAt(i);
          var u = (c >= 32 && c <= 126) ? w[c - 32] : 556;
          if (bold) u = Math.round(u * 1.06);
          t += u;
        }
        return t * size / 1000;
      };
    })();

    function esc(s) {
      return String(s).replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)')
        /* The standard fonts are Latin-1; drop anything outside it rather than
           emit bytes the viewer would render as noise. */
        .replace(/[^\x20-\x7E\xA0-\xFF]/g, function (ch) {
          return ({ '-': '-', '-': '-', '·': '-', '’': "'", '‘': "'", '“': '"', '”': '"', '…': '...' })[ch] || '';
        });
    }

    function fit(s, size, bold, max) {
      s = String(s == null ? '' : s);
      if (WID(s, size, bold) <= max) return s;
      while (s.length > 1 && WID(s + '...', size, bold) > max) s = s.slice(0, -1);
      return s + '...';
    }

    function Doc() {
      this.ops = [];
      this.img = null;
    }
    Doc.prototype.rect = function (x, y, w, h, rgb) {
      this.ops.push(rgb.join(' ') + ' rg ' + x.toFixed(2) + ' ' + (PT.h - y - h).toFixed(2) +
        ' ' + w.toFixed(2) + ' ' + h.toFixed(2) + ' re f');
      return this;
    };
    Doc.prototype.text = function (s, x, y, size, rgb, style, maxW, align) {
      var bold = style === 'b';
      s = maxW ? fit(s, size, bold, maxW) : String(s == null ? '' : s);
      var tx = x;
      if (align === 'r') tx = x - WID(s, size, bold);
      else if (align === 'c') tx = x - WID(s, size, bold) / 2;
      this.ops.push('BT ' + (FONTS[style] || FONTS.n) + ' ' + size + ' Tf ' +
        rgb.join(' ') + ' rg ' + tx.toFixed(2) + ' ' + (PT.h - y).toFixed(2) + ' Td (' + esc(s) + ') Tj ET');
      return this;
    };
    Doc.prototype.line = function (x1, y1, x2, y2, rgb, wdt) {
      this.ops.push(rgb.join(' ') + ' RG ' + (wdt || 0.5) + ' w ' +
        x1.toFixed(2) + ' ' + (PT.h - y1).toFixed(2) + ' m ' +
        x2.toFixed(2) + ' ' + (PT.h - y2).toFixed(2) + ' l S');
      return this;
    };
    Doc.prototype.image = function (data, x, y, w, h) {
      this.img = data;
      this.ops.push('q ' + w.toFixed(2) + ' 0 0 ' + h.toFixed(2) + ' ' +
        x.toFixed(2) + ' ' + (PT.h - y - h).toFixed(2) + ' cm /Im1 Do Q');
      return this;
    };

    /* Assemble the objects and the cross-reference table. */
    Doc.prototype.build = function () {
      var stream = this.ops.join('\n');
      var objs = [];
      objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
      objs[2] = '<< /Type /Pages /Kids [3 0 R] /Count 1 >>';
      var res = '/Font << /F1 5 0 R /F2 6 0 R /F3 7 0 R >>';
      if (this.img) res += ' /XObject << /Im1 8 0 R >>';
      objs[3] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + PT.w + ' ' + PT.h + '] ' +
                '/Resources << ' + res + ' >> /Contents 4 0 R >>';
      objs[4] = '<< /Length ' + stream.length + ' >>\nstream\n' + stream + '\nendstream';
      objs[5] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
      objs[6] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
      objs[7] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>';
      if (this.img) {
        objs[8] = '<< /Type /XObject /Subtype /Image /Width ' + this.img.w + ' /Height ' + this.img.h +
          ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Length ' + this.img.bytes.length + ' >>\n' +
          'stream\n@@IMG@@\nendstream';
      }

      /* Bytes are assembled here so the image stream stays binary-safe. */
      var enc = new TextEncoder();
      var parts = [], offsets = [], pos = 0;
      function push(u8) { parts.push(u8); pos += u8.length; }
      /* Binary marker so viewers treat the file as binary, written as bytes
         rather than literal characters to keep this source plain text. */
      push(enc.encode('%PDF-1.4\n%'));
      push(new Uint8Array([0xE2, 0xE3, 0xCF, 0xD3, 0x0A]));
      for (var i = 1; i < objs.length; i++) {
        offsets[i] = pos;
        var head = i + ' 0 obj\n';
        if (i === 8 && this.img) {
          var pre = objs[i].split('@@IMG@@')[0];
          var post = objs[i].split('@@IMG@@')[1];
          push(enc.encode(head + pre));
          push(this.img.bytes);
          push(enc.encode(post + '\nendobj\n'));
        } else {
          push(enc.encode(head + objs[i] + '\nendobj\n'));
        }
      }
      var xref = pos;
      var x = 'xref\n0 ' + objs.length + '\n0000000000 65535 f \n';
      for (var j = 1; j < objs.length; j++) {
        x += ('0000000000' + offsets[j]).slice(-10) + ' 00000 n \n';
      }
      x += 'trailer\n<< /Size ' + objs.length + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF';
      push(enc.encode(x));

      var total = parts.reduce(function (s, p) { return s + p.length; }, 0);
      var out = new Uint8Array(total), o = 0;
      parts.forEach(function (p) { out.set(p, o); o += p.length; });
      return out;
    };

    return { Doc: Doc, PT: PT, width: WID };
  })();

  /* Decode the logo to raw RGB via canvas, PDF cannot read PNG directly, and
     the uncompressed RGB form is the one that needs no deflate. */
  function logoRgb() {
    return loadLogo().then(function (dataUri) {
      if (!dataUri) return null;
      return new Promise(function (resolve) {
        var im = new Image();
        im.onload = function () {
          var W = 96, H = Math.max(1, Math.round(im.height * W / im.width));
          var cv = document.createElement('canvas');
          cv.width = W; cv.height = H;
          var ctx = cv.getContext('2d');
          /* Flatten onto white: PDF DeviceRGB has no alpha channel. */
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, W, H);
          ctx.drawImage(im, 0, 0, W, H);
          var px = ctx.getImageData(0, 0, W, H).data;
          var rgb = new Uint8Array(W * H * 3);
          for (var i = 0, j = 0; i < px.length; i += 4) {
            rgb[j++] = px[i]; rgb[j++] = px[i + 1]; rgb[j++] = px[i + 2];
          }
          resolve({ w: W, h: H, bytes: rgb });
        };
        im.onerror = function () { resolve(null); };
        im.src = dataUri;
      });
    });
  }

  /* The logo as a data URI, so a downloaded report carries its own branding
     and does not break when moved away from this folder. */
  var logoData = null;
  function loadLogo() {
    if (logoData !== null) return Promise.resolve(logoData);
    return fetch('assets/logo_only__1_-removebg-preview.png')
      .then(function (r) { return r.blob(); })
      .then(function (b) {
        return new Promise(function (resolve) {
          var fr = new FileReader();
          fr.onload = function () { logoData = fr.result; resolve(logoData); };
          fr.onerror = function () { logoData = ''; resolve(''); };
          fr.readAsDataURL(b);
        });
      })
      .catch(function () { logoData = ''; return ''; });
  }

  /* Branded report as a self-contained file. It downloads like any other
     document, opens in any browser, and has a Save as PDF button inside it. */
  /* Draws the portfolio report as a real PDF and downloads it. */
  function exportPdf(covMap, logo) {
    var rows = portfolioRows(covMap);
    var c = counts(), total = state.businesses.length;
    var totalFunding = state.businesses.reduce(function (s, b) { return s + b.fundingAmount; }, 0);
    var jobs = rows.reduce(function (s, r) { return s + r.jobs; }, 0);
    var avgScore = Math.round(state.businesses.reduce(function (s, b) { return s + computeHealth(b).score; }, 0) / total);

    var NAVY = [0.039, 0.145, 0.251], INK = [0.039, 0.145, 0.251];
    var MUTED = [0.365, 0.435, 0.533], FAINT = [0.545, 0.608, 0.690];
    var CYAN = [0.043, 0.486, 0.549], LINE = [0.867, 0.898, 0.941], BG = [0.933, 0.949, 0.973];
    var TONE = {
      green: { fg: [0.071, 0.502, 0.361], bg: [0.890, 0.965, 0.933] },
      yellow: { fg: [0.659, 0.416, 0.000], bg: [0.992, 0.945, 0.863] },
      red: { fg: [0.753, 0.196, 0.169], bg: [0.992, 0.918, 0.910] }
    };

    var d = new PDF.Doc();
    var M = 36, y = M;

    /* Header */
    if (logo) d.image(logo, M, y - 4, 34, 34 * logo.h / logo.w);
    var tx = logo ? M + 44 : M;
    d.text('Portfolio Report', tx, y + 15, 19, INK, 'b');
    d.text('Proven - Turning Potential into Proof', tx, y + 29, 9.5, CYAN, 'i');
    d.text(fmtDate(new Date().toISOString().slice(0, 10)), PDF.PT.w - M, y + 12, 9, MUTED, 'n', 0, 'r');
    d.text(total + ' funded businesses', PDF.PT.w - M, y + 24, 9, MUTED, 'n', 0, 'r');
    y += 44;
    d.line(M, y, PDF.PT.w - M, y, NAVY, 2);
    y += 18;

    /* Summary tiles */
    var tiles = [
      ['TOTAL FUNDING', money(totalFunding)],
      ['JOBS SUPPORTED', String(jobs)],
      ['PORTFOLIO HEALTH', avgScore + '/100'],
      ['NEEDS ATTENTION', String(c.red + c.yellow)]
    ];
    var tw = (PDF.PT.w - M * 2 - 3 * 10) / 4;
    tiles.forEach(function (t, i) {
      var x = M + i * (tw + 10);
      d.rect(x, y, tw, 42, BG);
      d.text(t[0], x + 10, y + 15, 7.5, MUTED, 'b', tw - 20);
      d.text(t[1], x + 10, y + 32, 14, INK, 'b', tw - 20);
    });
    y += 58;

    d.text('FUNDED BUSINESSES - WORST FIRST', M, y, 8.5, MUTED, 'b');
    y += 10;

    /* Table */
    var COLS = [
      { t: 'BUSINESS', w: 150, k: 'name' },
      { t: 'OWNER', w: 92, k: 'owner' },
      { t: 'GRANT', w: 62, k: 'grant', a: 'r', money: true },
      { t: 'REL.', w: 38, k: 'released', a: 'r', pct: true },
      { t: 'SCORE', w: 42, k: 'score', a: 'r' },
      { t: 'BAND', w: 54, k: 'band', band: true },
      { t: 'CREDIT READINESS', w: 118, k: 'readiness' },
      { t: 'REPORTING', w: 78, k: 'reporting' },
      { t: 'EVID.', w: 40, k: 'coverage', a: 'r', pct: true },
      { t: 'JOBS', w: 32, k: 'jobs', a: 'r' }
    ];
    var xs = [], cx = M;
    COLS.forEach(function (col) { xs.push(cx); cx += col.w; });

    d.rect(M, y, PDF.PT.w - M * 2, 20, NAVY);
    COLS.forEach(function (col, i) {
      var x = col.a === 'r' ? xs[i] + col.w - 6 : xs[i] + 6;
      d.text(col.t, x, y + 13.5, 7.5, [1, 1, 1], 'b', col.w - 12, col.a);
    });
    y += 20;

    rows.forEach(function (r) {
      var rh = 30;
      d.text(r.name, xs[0] + 6, y + 13, 9.5, INK, 'b', COLS[0].w - 12);
      d.text(r.industry + ' - ' + r.region, xs[0] + 6, y + 23, 7, FAINT, 'n', COLS[0].w - 12);
      COLS.forEach(function (col, i) {
        if (i === 0) return;
        var v = r[col.k];
        if (col.money) v = money(v);
        else if (col.pct) v = v + '%';
        var x = col.a === 'r' ? xs[i] + col.w - 6 : xs[i] + 6;
        if (col.band) {
          var tone = TONE[r.tier];
          var bw = PDF.width(String(v), 8, true) + 12;
          d.rect(xs[i] + 4, y + 6, bw, 14, tone.bg);
          d.text(String(v), xs[i] + 10, y + 16, 8, tone.fg, 'b', col.w - 12);
        } else {
          var col2 = (col.k === 'reporting' && r.reportState === 'overdue') ? TONE.red.fg : INK;
          var st = (col.k === 'score') ? 'b' : 'n';
          d.text(String(v), x, y + 16, 9, col2, st, col.w - 12, col.a);
        }
      });
      y += rh;
      d.line(M, y, PDF.PT.w - M, y, LINE, 0.6);
    });

    y += 16;
    d.text('Scores are calculated from four weighted measures: sales trend 35%, spending control 25%,',
      M, y, 7.5, FAINT, 'i');
    d.text('reporting consistency 20%, customer growth 20%. Credit readiness is evidence to support, not replace, a formal credit assessment.',
      M, y + 10, 7.5, FAINT, 'i');

    var bytes = d.build();
    var blob = new Blob([bytes], { type: 'application/pdf' });
    var url = URL.createObjectURL(blob);
    var name = 'proven-portfolio-report-' + new Date().toISOString().slice(0, 10) + '.pdf';

    /* Open it in a tab so the report can be read before it is saved, the
       browser's own PDF viewer supplies the download and print controls. If
       pop-ups are blocked, fall back to saving it directly rather than
       leaving the click doing nothing. */
    var tab = window.open(url, '_blank');
    if (!tab || tab.closed || typeof tab.closed === 'undefined') {
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast('Pop-up blocked, the report was downloaded instead');
    }
    /* Held long enough for the tab to load; revoking too early blanks it. */
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  }

  function downloadBlob(content, type, filename) {
    var blob = new Blob([content], { type: type + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function portfolioRow(b) {
    var h = computeHealth(b), t = trendOf(b), cr = creditReadiness(b), rep = reportingStatus(b);
    var last = b.history[b.history.length - 1];
    return '<tr data-biz="' + b.id + '"><td><div class="biz-cell"><div class="avatar">' + initials(b.name) + '</div><div><div class="nm">' + esc(b.name) + '</div><div class="sc">' + esc(b.owner) + ' · ' + esc(b.industry) + '</div></div></div></td>' +
      '<td class="mono">' + moneyShort(b.fundingAmount) + '</td>' +
      '<td class="tiny">' + esc(currentMilestone(b)) + '</td>' +
      '<td><div class="scorebox"><span class="scorenum">' + h.score + '</span><span class="minibar"><i class="' + h.tier + '" style="width:' + h.score + '%"></i></span></div></td>' +
      '<td><span class="chip ' + h.tier + '"><span class="dot"></span>' + tierLabel(h.tier) + '</span></td>' +
      '<td class="hide-sm"><span class="trend ' + t + '">' + trendGlyph(t) + '</span></td>' +
      '<td><span class="due-pill ' + rep.state + '">' + esc(rep.label) + '</span>' +
        '<div class="tiny muted">' + (b.actioned ? '✔ followed up ' + fmtDateShort(b.actioned) : 'due ' + fmtDateShort(rep.due)) + '</div></td>' +
      '<td><span class="chip ' + cr.color + '">' + cr.status + '</span></td></tr>';
  }

  /* =========================================================================
     11. RENDER, BUSINESS PROFILE (shared)
     ========================================================================= */
  /* Evidence summary as the funder sees it, the same coverage figure the
     entrepreneur sees on their own Transactions tab. Proof metadata for the
     profiled business is loaded by render() before this runs. */
  function evidencePanel(biz) {
    var cov = evidenceCoverage(biz);
    var tone = cov.pct >= 70 ? 'var(--green)' : cov.pct >= 40 ? 'var(--yellow)' : 'var(--red)';
    var verdict = cov.pct >= 70 ? 'Well documented'
      : cov.pct >= 40 ? 'Partially documented'
      : cov.count === 0 ? 'No transactions logged yet' : 'Thinly documented';
    return '<div class="panel"><div class="panel-head"><h3>Proof behind the numbers</h3>' +
      '<span class="hint" style="margin-left:auto">Same view as the entrepreneur</span></div><div class="panel-body">' +
      '<div class="cov-head"><div><div class="cov-title">' + verdict + '</div>' +
      '<div class="tiny muted">' + cov.withProof + ' of ' + cov.count + ' entries carry a document</div></div>' +
      '<div class="cov-pct" style="color:' + tone + '">' + cov.pct + '%</div></div>' +
      '<div class="cov-bar"><span style="width:' + cov.pct + '%;background:' + tone + '"></span></div>' +
      '<div class="cov-note">Coverage is the share of all logged value, income and costs, that has a supporting document attached. ' +

  }

    var guidance = getGuidance(biz).map(recCardHtml).join('');

        '<span class="chip ' + cr.color + '">' + cr.status + '</span> ' +

          (biz.actioned

            : '<button class="btn ghost sm" id="markActioned" style="margin-top:9px">Mark as followed up</button>') +
        '</div></div></div>';

    var TABS = [
      { key: 'overview', label: 'Overview' },

    }).join('') + '</div>';

    var bodyHtml;
    if (tab === 'score') {
      bodyHtml = '<div class="panel"><div class="panel-head"><h3>Why this score</h3>' +
        '<span class="hint" style="margin-left:auto">Four measures, each shown with its weight</span></div>' +

        esc(dec.why) + '</div></div>';

    } else if (tab === 'performance') {
      /* Chart and stages sit side by side, the stages list is narrow enough to

      bodyHtml = '<div class="perf-split">' +
        '<div class="panel"><div class="panel-head"><h3>Money in and money out</h3>' +
          '<span class="hint" style="margin-left:auto">Last ' + Math.min(biz.history.length, 8) + ' months</span></div>' +
          '<div class="panel-body">' + lineChart(biz) + '</div></div>' +
        '<div class="panel"><div class="panel-head"><h3>Stages</h3>' +
          '<span class="hint" style="margin-left:auto">' + milestoneProgress(biz) + '% complete</span></div>' +
          '<div class="panel-body">' + msRows + '</div></div>' +
      '</div>';

    } else if (tab === 'evidence') {
      bodyHtml = evidencePanel(biz) +
        '<div class="panel" style="margin-top:16px"><div class="panel-head"><h3>What the owner was told to do</h3>' +
        '<span class="hint" style="margin-left:auto">The same advice they see</span></div>' +
        '<div class="panel-body">' + guidance + '</div></div>';

    } else {
      /* Overview, who they are, what the money has done, what it is earning. */
      var months = biz.history.length;
      var jobs = (biz.team && biz.team.staff ? biz.team.staff : 0) + 1;
      bodyHtml = '<div class="grid2"><div class="stack">' +
          '<div class="panel"><div class="panel-head"><h3>About this business</h3></div><div class="panel-body">' +
            '<div class="about-grid">' +
              '<div class="ab"><div class="l">Led by</div><div class="v">' + esc(biz.owner) + '</div></div>' +
              '<div class="ab"><div class="l">People employed</div><div class="v">' + jobs + '</div>' +
                '<div class="s">' + esc(biz.team && biz.team.roles ? biz.team.roles : 'Owner only') + '</div></div>' +
              '<div class="ab"><div class="l">Trading since</div><div class="v">' + (biz.started ? monthLabel(biz.started + '-15') : '-') + '</div></div>' +
              '<div class="ab"><div class="l">On Proven</div><div class="v">' + months + ' months</div>' +
                '<div class="s">last update ' + fmtDate(biz.history[months - 1].date) + '</div></div>' +
              '<div class="ab"><div class="l">Grant</div><div class="v">' + money(biz.fundingAmount) + '</div></div>' +
              '<div class="ab"><div class="l">Released so far</div><div class="v">' + fundingUtilisation(biz) + '%</div>' +

            '<div class="panel-body" style="font-size:13px;color:var(--muted);line-height:1.6">' + esc(dec.why) + '</div></div>' +
        '</div><div class="stack">' +
          '<div class="cr-hero"><div class="tiny" style="color:#9fb6d1;text-transform:uppercase;letter-spacing:.06em;font-weight:700">Credit readiness</div>' +
            '<div class="status">' + cr.status + '</div>' +
            '<div class="tiny" style="color:#b9cbe0;margin-top:2px">' + esc(cr.plain) + '</div>' +
            '<ul>' + cr.reasons.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul>' +
            '<div class="tiny" style="margin-top:12px;color:#9fb6d1">This is evidence to support, not replace, a formal credit assessment.</div></div>' +
        '</div></div>';
    }

    return '<button class="back" data-back-to="' + returnTo + '">' +
      (returnTo === 'attention' ? 'Back to needs attention' : 'Back to portfolio') + '</button>' +
      head + tabsHtml + bodyHtml;
  }

  /* =========================================================================
     12. MAIN RENDER + EVENTS
     ========================================================================= */
  /* Which business's proofs the current screen needs. */
  function proofSubject() {
    if (state.role === 'funder' && state.funderView === 'profile') return state.profileId;
    if (state.role === 'entrepreneur') return state.bizId;
    return null;
  }
  /* -------------------------------------------------------------------------
     URL routing. The platform is one file, so the path is kept in step with
     the role by hand: /platform is the picker, /entrepreneur and /funder open
     straight into a side. That makes each view linkable and the back button
     behave the way a visitor expects.
     ------------------------------------------------------------------------- */
  var ROUTES = { landing: '/platform', entrepreneur: '/entrepreneur', funder: '/funder' };
  var lastRenderedRole = null;

  function roleFromPath() {
    var p;
    try {
      p = location.pathname.replace(/\/+$/, '').toLowerCase();
    } catch (e) { return 'landing'; }
    if (p === '/entrepreneur') return 'entrepreneur';
    if (p === '/funder') return 'funder';
    return 'landing';
  }

  function syncUrl(replace) {
    try {
      if (!window.history || !history.pushState) return;
      var want = ROUTES[state.role] || '/platform';
      if (location.pathname.replace(/\/+$/, '') === want) return;
      history[replace ? 'replaceState' : 'pushState']({ role: state.role }, '', want);
    } catch (e) { /* file:// blocks pushState, the app still works */ }
  }

  window.addEventListener('popstate', function () {
    var r = roleFromPath();
    if (r === state.role) return;
    state.role = r;
    if (r === 'entrepreneur') state.entTab = 'overview';
    if (r === 'funder') state.funderView = 'portfolio';
    render();
  });

  function render() {
    saveState(); /* every change reaches here, so this keeps the save current */
    /* Entering or leaving a role is a navigation, so it gets a history entry;
       everything else just keeps the address bar honest. */
    syncUrl(state.role === lastRenderedRole);
    lastRenderedRole = state.role;
    var html = state.role === 'landing' ? renderLanding() : state.role === 'entrepreneur' ? renderEntrepreneur() : renderFunder();
    document.getElementById('root').innerHTML = html;
    window.scrollTo({ top: 0, behavior: 'smooth' });

    /* If the screen is showing a business whose proofs we do not currently
       hold, load them and draw once more. Because this tracks the business
       actually loaded, switching entrepreneur -> funder on the same business
       reuses the fresh index instead of showing stale coverage. */
    var want = proofSubject();
    if (want && want !== proofsLoadedForBiz) {
      proofsLoadedForBiz = want; /* claim it up front so this cannot loop */
      refreshProofs(want).then(function () {
        var still = proofSubject();
        if (still === want) {
          document.getElementById('root').innerHTML =
            state.role === 'entrepreneur' ? renderEntrepreneur() : renderFunder();
        }
      });
    }
  }

  document.addEventListener('click', function (e) {
    var enter = e.target.closest('[data-enter]');
    if (enter) { state.role = enter.getAttribute('data-enter'); if (state.role === 'entrepreneur') state.entTab = 'overview'; else { state.funderView = 'portfolio'; } render(); return; }

    var nav = e.target.closest('[data-nav]');
    if (nav) {
      var key = nav.getAttribute('data-nav');
      if (key === 'home') { state.role = 'landing'; render(); return; }
      if (state.role === 'entrepreneur') { state.entTab = key; render(); return; }
      if (state.role === 'funder' && (key === 'portfolio' || key === 'attention')) {
        state.funderView = key; render(); return;
      }
    }

    /* Triage screen: open a record, or record the follow-up in place. */
    var attOpen = e.target.closest('[data-biz-att]');
    if (attOpen) {
      state.profileId = attOpen.getAttribute('data-biz-att');
      state.profileReturn = 'attention';
      state.funderView = 'profile';
      state.profileTab = 'overview';
      render(); return;
    }
    var attAct = e.target.closest('[data-att-action]');
    if (attAct) {
      var ab = byId(attAct.getAttribute('data-att-action'));
      if (ab) {
        ab.actioned = new Date().toISOString().slice(0, 10);
        showToast('Recorded as followed up');
        render();
      }
      return;
    }

    var filter = e.target.closest('[data-filter]');
    if (filter) { state.filterTier = filter.getAttribute('data-filter'); render(); return; }

    var bizRow = e.target.closest('[data-biz]');
    if (bizRow) { state.profileId = bizRow.getAttribute('data-biz'); state.profileReturn = 'funder'; state.funderView = 'profile'; state.profileTab = 'overview'; render(); return; }

    var backTo = e.target.closest('[data-back-to]');
    if (backTo) {
      /* Return to whichever screen the record was opened from. */
      var dest = backTo.getAttribute('data-back-to');
      state.funderView = dest === 'attention' ? 'attention' : 'portfolio';
      state.profileTab = 'overview';
      render(); return;
    }

    var ptab = e.target.closest('[data-ptab]');
    if (ptab) { state.profileTab = ptab.getAttribute('data-ptab'); render(); return; }

    if (e.target.id === 'markActioned') {
      var mb = byId(state.profileId);
      if (mb) {
        mb.actioned = new Date().toISOString().slice(0, 10);
        showToast('Recorded as followed up, visible on the portfolio');
        render();
      }
      return;
    }

    if (e.target.closest && e.target.closest('#exportExcel')) {
      allCoverage().then(function (map) {
        exportExcel(map);
        showToast('Portfolio downloaded, open it in Excel');
      });
      return;
    }

    if (e.target.closest && e.target.closest('#exportPdf')) {
      /* exportPdf reports its own outcome when a pop-up blocker intervenes. */
      Promise.all([allCoverage(), logoRgb()]).then(function (r) {
        exportPdf(r[0], r[1]);
      });
      return;
    }

    var msAction = e.target.closest('[data-milestone-action]');
    if (msAction) {
      var biz = byId(state.bizId), idx = parseInt(msAction.getAttribute('data-idx'), 10), act = msAction.getAttribute('data-milestone-action');
      if (act === 'complete') { biz.milestones[idx].status = 'done'; if (biz.milestones[idx + 1]) biz.milestones[idx + 1].status = 'current'; showToast('Milestone marked complete'); }
      else { biz.milestones[idx].status = 'delayed'; showToast('Milestone flagged as delayed, see Recommendations'); }
      render(); return;
    }

    if (e.target.id === 'resetDemo') {
      clearSaved();
      try { localStorage.removeItem('provenProofsSeeded'); } catch (er) {}
      state.businesses = makeSeed();
      state.draft = {};
      proofIndex = {};
      proofsLoadedForBiz = null;
      showToast('Demo reset to the starting example data');
      render();
      seedProofs().then(function () { proofsLoadedForBiz = null; render(); });
      return;
    }

    if (e.target.id === 'addTxnBtn') {
      var b = byId(state.bizId), desc = document.getElementById('txnDesc').value.trim() || 'Transaction', type = document.getElementById('txnType').value, cat = document.getElementById('txnCat').value, amt = parseFloat(document.getElementById('txnAmt').value) || 0;
      if (amt <= 0) { showToast('Enter an amount to add a transaction'); return; }
      var nextPeriod = 'P' + (b.history.length + 1);
      var entry = { date: new Date().toISOString().slice(0, 10), period: nextPeriod, desc: desc, category: cat, type: type, amount: amt };
      b.ledger.push(entry);
      var d = draftFor(b.id); if (type === 'revenue') d.revenue += amt; else d.expenses += amt;

      /* Carry any file picked on the form across to the new ledger entry. */
      var picked = pendingProof;
      pendingProof = null;
      if (picked) {
        var ref = txnRef(entry, b.ledger.length - 1);
        ProofStore.put(b.id, ref, picked).then(function () {
          return refreshProofs(b.id);
        }).then(function () {
          showToast('Transaction added with proof attached');
          render();
        }).catch(function () {
          showToast('Transaction added, but the document could not be saved');
          render();
        });
        return;
      }
      showToast('Transaction added'); render(); return;
    }

    /* Open a stored receipt. */
    var viewBtn = e.target.closest ? e.target.closest('[data-proof-view]') : null;
    if (viewBtn) { openProof(viewBtn.getAttribute('data-proof-view')); return; }

    if (e.target.id === 'proofClose' || e.target.classList.contains('proof-modal')) { closeProof(); return; }
    if (e.target.id === 'proofRemove') {
      var rref = e.target.getAttribute('data-ref');
      ProofStore.remove(state.bizId, rref).then(function () {
        return refreshProofs(state.bizId);
      }).then(function () { closeProof(); showToast('Document removed'); render(); });
      return;
    }

    if (e.target.id === 'submitPeriodBtn') {
      var biz2 = byId(state.bizId), d2 = draftFor(biz2.id);
      var cust = parseInt(document.getElementById('submitCust').value, 10) || biz2.history[biz2.history.length - 1].customers;
      var note = document.getElementById('submitNote').value.trim();
      var msChoice = document.getElementById('submitMilestone').value;
      var prevRev = biz2.history[biz2.history.length - 1].revenue;
      var newRevenue = d2.revenue > 0 ? d2.revenue : prevRev;
      var newExpenses = d2.expenses > 0 ? d2.expenses : biz2.history[biz2.history.length - 1].expenses;
      submitPeriod(biz2, { revenue: newRevenue, expenses: newExpenses, customers: cust, status: 'on-time', note: note });
      applyMilestoneChoice(biz2, msChoice);
      state.draft[biz2.id] = { revenue: 0, expenses: 0 };
      showToast('Monthly update submitted, score recalculated'); render(); return;
    }

    if (e.target.id === 'quickDemoBtn') {
      var biz3 = byId(state.bizId);
      var scripted = biz3.script && biz3.scriptStep < biz3.script.length ? biz3.script[biz3.scriptStep] : null;
      var last = biz3.history[biz3.history.length - 1];
      var rev, exp, cust3, status;
      if (scripted) {
        rev = Math.max(0, Math.round(last.revenue * (1 + scripted.rev) / 100) * 100);
        exp = Math.max(0, Math.round(last.expenses * (1 + scripted.exp) / 100) * 100);
        cust3 = Math.max(0, Math.round(last.customers * (1 + scripted.cust)));
        status = scripted.status; biz3.scriptStep++;
      } else {
        rev = Math.round(last.revenue * 0.8 / 100) * 100; exp = Math.round(last.expenses * 1.15 / 100) * 100; cust3 = Math.round(last.customers * 0.9); status = 'late';
      }
      submitPeriod(biz3, { revenue: rev, expenses: exp, customers: cust3, status: status, note: 'Rough month, logged via quick demo.' });
      state.draft[biz3.id] = { revenue: 0, expenses: 0 };
      showToast('Rough month logged, watch the score update'); render(); return;
    }
  });

  document.addEventListener('change', function (e) {
    if (e.target.id === 'bizPick') {
      state.bizId = e.target.value;
      state.draft[state.bizId] = state.draft[state.bizId] || { revenue: 0, expenses: 0 };
      refreshProofs(state.bizId).then(render);
      return;
    }
    if (e.target.id === 'sortSel') { state.sortKey = e.target.value; render(); return; }

    /* File chosen on the add-transaction form, held until the entry is created. */
    if (e.target.id === 'txnProof') {
      var f = e.target.files && e.target.files[0];
      if (!f) { pendingProof = null; return; }
      if (!checkFile(f)) { e.target.value = ''; return; }
      pendingProof = f;
      var lbl = document.getElementById('txnProofLabel');
      var pick = e.target.parentNode;
      if (lbl) lbl.textContent = f.name.length > 28 ? f.name.slice(0, 26) + '…' : f.name;
      if (pick) pick.classList.add('ready');
      return;
    }

    /* File chosen against an existing ledger row. */
    if (e.target.hasAttribute && e.target.hasAttribute('data-proof-for')) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      if (!checkFile(file)) { e.target.value = ''; return; }
      var ref = e.target.getAttribute('data-proof-for');
      ProofStore.put(state.bizId, ref, file).then(function () {
        return refreshProofs(state.bizId);
      }).then(function () {
        showToast('Document attached, pending review');
        render();
      }).catch(function () {
        showToast('That document could not be saved on this device');
      });
      return;
    }
  });

  function checkFile(f) {
    if (f.size > MAX_PROOF) { showToast('That file is larger than 8MB, attach a smaller photo or PDF'); return false; }
    if (f.size === 0) { showToast('That file appears to be empty'); return false; }
    return true;
  }

  function fileSize(n) {
    if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';
    if (n >= 1024) return Math.round(n / 1024) + ' KB';
    return n + ' B';
  }

  /* ---- Receipt viewer ---------------------------------------------------- */
  var proofUrl = null;

  function closeProof() {
    var m = document.getElementById('proofModal');
    if (m) m.parentNode.removeChild(m);
    if (proofUrl) { URL.revokeObjectURL(proofUrl); proofUrl = null; }
  }

  function openProof(ref) {
    ProofStore.get(state.bizId, ref).then(function (rec) {
      if (!rec) { showToast('That document is no longer stored on this device'); return; }
      closeProof();
      proofUrl = URL.createObjectURL(rec.blob);
      var isImg = /^image\//.test(rec.type);
      var body = isImg
        ? '<img src="' + proofUrl + '" alt="' + esc(rec.name) + '" />'
        : '<div class="nofile">' + esc(rec.name) + '<br/><span class="tiny">Open or download to view this file.</span></div>';
      var m = document.createElement('div');
      m.className = 'proof-modal';
      m.id = 'proofModal';
      m.innerHTML = '<div class="box">' +
        '<div class="bh"><div><h3>' + esc(rec.name) + '</h3>' +
          '<div class="tiny muted">' + fileSize(rec.size) + ' · attached ' + fmtDateShort(rec.uploadedAt.slice(0, 10)) + '</div></div>' +
          '<span class="pending-tag">Pending review</span></div>' +
        '<div class="bb">' + body + '</div>' +
        '<div class="bf">' +
          '<button class="btn ghost sm" id="proofRemove" data-ref="' + esc(ref) + '">Remove</button>' +
          '<a class="btn ghost sm" href="' + proofUrl + '" download="' + esc(rec.name) + '">Download</a>' +
          '<button class="btn sm" id="proofClose">Close</button>' +
        '</div></div>';
      document.body.appendChild(m);
    }).catch(function () { showToast('Could not open that document'); });
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeProof();
  });

  /* Legend and donut highlight each other, and the centre reports the band
     being hovered rather than staying a static total. */
  document.addEventListener('mouseover', function (e) {
    var t = e.target.closest ? e.target.closest('[data-band-btn], [data-band]') : null;
    if (!t) return;
    var band = t.getAttribute('data-band-btn') || t.getAttribute('data-band');
    var panel = t.closest('.panel');
    if (!panel || !band) return;
    var slice = panel.querySelector('.dslice[data-band="' + band + '"]');
    if (slice) {
      panel.querySelectorAll('.dslice').forEach(function (s) { s.classList.remove('on'); });
      slice.classList.add('on');
      panel.querySelector('.dslices').style.setProperty('--hovering', '1');
      var num = panel.querySelector('.dnum'), lbl = panel.querySelector('.dlbl');
      if (num && lbl) {
        if (!num.dataset.orig) { num.dataset.orig = num.textContent; lbl.dataset.orig = lbl.textContent; }
        num.textContent = slice.getAttribute('data-count');
        lbl.textContent = slice.getAttribute('data-label');
      }
    }
    var btn = panel.querySelector('[data-band-btn="' + band + '"]');
    if (btn) btn.classList.add('on');
  });

  document.addEventListener('mouseout', function (e) {
    var t = e.target.closest ? e.target.closest('[data-band-btn], [data-band]') : null;
    if (!t) return;
    var panel = t.closest('.panel');
    if (!panel) return;
    panel.querySelectorAll('.dslice').forEach(function (s) { s.classList.remove('on'); });
    panel.querySelectorAll('[data-band-btn]').forEach(function (b) {
      if (b.getAttribute('data-band-btn') !== state.filterTier) b.classList.remove('on');
    });
    var num = panel.querySelector('.dnum'), lbl = panel.querySelector('.dlbl');
    if (num && num.dataset.orig) { num.textContent = num.dataset.orig; lbl.textContent = lbl.dataset.orig; }
  });

  /* ---------------------------------------------------------------------
     Chart hover, one invisible column per month drives a tooltip, a
     crosshair and two markers. Delegated so it survives every re-render.
     --------------------------------------------------------------------- */
  document.addEventListener('mouseover', function (e) {
    var hot = e.target.closest ? e.target.closest('.chart .hot') : null;
    if (!hot) return;
    var wrap = hot.closest('.chart-wrap');
    var svg = hot.closest('svg');
    var tip = wrap.querySelector('.chart-tip');
    var cross = svg.querySelector('.crosshair');
    var mRev = svg.querySelector('#markRev');
    var mExp = svg.querySelector('#markExp');
    if (!tip) return;

    var p = (hot.getAttribute('data-tip') || '').split('||');
    var cx = parseFloat(hot.getAttribute('data-cx'));
    var ry = parseFloat(hot.getAttribute('data-rev-y'));
    var ey = parseFloat(hot.getAttribute('data-exp-y'));

    tip.innerHTML =
      '<div class="tt">' + esc(p[0]) + '</div>' +
      '<div class="tr"><span>Money in</span><b>' + esc(p[2]) + '</b></div>' +
      '<div class="tr"><span>Money out</span><b>' + esc(p[3]) + '</b></div>' +
      '<div class="tr"><span>' + (p[5] === 'up' ? 'Kept' : 'Short') + '</span><b style="color:' + (p[5] === 'up' ? '#4ade80' : '#fca5a5') + '">' + esc(p[4]) + '</b></div>' +
      '<div class="tsub">' + esc(p[6]) + ' customers · ' + esc(p[7]) + '</div>';

    if (cross) { cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('opacity', '1'); }
    if (mRev) { mRev.setAttribute('cx', cx); mRev.setAttribute('cy', ry); mRev.setAttribute('opacity', '1'); }
    if (mExp) { mExp.setAttribute('cx', cx); mExp.setAttribute('cy', ey); mExp.setAttribute('opacity', '1'); }

    /* Place the tooltip over the hovered month, flipped near the right edge
       so it never runs outside the panel. */
    var box = svg.getBoundingClientRect();
    var vb = svg.viewBox.baseVal;
    var scale = box.width / (vb && vb.width ? vb.width : box.width);
    var px = cx * scale;
    tip.classList.add('on');
    var tw = tip.offsetWidth, th = tip.offsetHeight;
    var GAP = 14;

    /* Sit beside the hovered month, not on top of it, so the points and both
       lines stay visible while reading the figures. Flips to the other side
       near the right edge. */
    var leftPos = px + GAP;
    if (leftPos + tw > box.width - 4) leftPos = px - tw - GAP;
    if (leftPos < 4) leftPos = 4;

    /* Vertically centred on the two markers, then kept inside the panel. */
    var mid = (ry + ey) / 2 * scale;
    var topPos = mid - th / 2;
    if (topPos < 4) topPos = 4;
    if (topPos + th > box.height - 4) topPos = Math.max(4, box.height - th - 4);

    tip.style.left = leftPos + 'px';
    tip.style.top = topPos + 'px';
  });

  document.addEventListener('mouseout', function (e) {
    var hot = e.target.closest ? e.target.closest('.chart .hot') : null;
    if (!hot) return;
    var wrap = hot.closest('.chart-wrap');
    var svg = hot.closest('svg');
    if (e.relatedTarget && wrap && wrap.contains(e.relatedTarget) && e.relatedTarget.classList.contains('hot')) return;
    var tip = wrap && wrap.querySelector('.chart-tip');
    if (tip) tip.classList.remove('on');
    ['.crosshair', '#markRev', '#markExp'].forEach(function (s) {
      var el = svg && svg.querySelector(s);
      if (el) el.setAttribute('opacity', '0');
    });
  });

  document.addEventListener('input', function (e) {
    if (e.target.id === 'q') { state.query = e.target.value; var pos = e.target.selectionStart; render(); var again = document.getElementById('q'); if (again) { again.focus(); again.setSelectionRange(pos, pos); } }
  });

  function applyMilestoneChoice(biz, choice) {
    var idx = -1;
    for (var i = 0; i < biz.milestones.length; i++) if (biz.milestones[i].status === 'current' || biz.milestones[i].status === 'delayed') { idx = i; break; }
    if (idx === -1) return;
    if (choice === 'complete') { biz.milestones[idx].status = 'done'; if (biz.milestones[idx + 1]) biz.milestones[idx + 1].status = 'current'; }
    else if (choice === 'delayed') { biz.milestones[idx].status = 'delayed'; }
  }

  function submitPeriod(biz, p) {
    var idx = biz.history.length, prevDate = biz.history[biz.history.length - 1].date;
    var dt = new Date(prevDate + 'T00:00:00Z'); dt.setUTCMonth(dt.getUTCMonth() + 1);
    var date = PERIOD_DATES[idx] || dt.toISOString().slice(0, 10);
    biz.history.push({ period: 'P' + (idx + 1), date: date, revenue: p.revenue, expenses: p.expenses, customers: p.customers, status: p.status });
    if (p.note) biz.notes.push({ date: date, title: 'Status update, P' + (idx + 1), detail: p.note });
    var h = computeHealth(biz);
    biz.notes.push({ date: date, title: 'Score recalculated: ' + h.score + ' (' + tierLabel(h.tier) + ')', detail: getGuidance(biz)[0] ? getGuidance(biz)[0].issue : 'No major issues detected.' });
  }

  /* Draw immediately, then attach the sample receipts and redraw so evidence
     coverage is populated from the first screen the user sees. */
  render();
  seedProofs().then(function () {
    proofsLoadedForBiz = null;
    return refreshPortfolioCoverage();
  }).then(function () {
    render();
  });
})();
</script>
</body>
