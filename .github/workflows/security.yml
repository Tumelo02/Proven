name: Security Scanning

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  dependency-scanning:
    name: Dependency & Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # One lockfile at the repository root covers every workspace; `npm ci`
      # inside app/ or packages/engine has no lockfile of its own to read and
      # fails outright.
      - name: Install dependencies
        run: npm ci

      - name: Run npm audit for vulnerabilities
        run: npm audit --audit-level=moderate || true

      - name: Check for deprecated dependencies
        run: npm outdated || true

  sast-scanning:
    name: SAST - Static Application Security Testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install ESLint security plugin
        run: |
          cd app
          npm install --save-dev eslint-plugin-security

      - name: Run ESLint with security checks
        run: |
          cd app
          npx eslint "src/**/*.{ts,tsx}" --plugin security --rule 'security/*: error' || true

  secret-scanning:
    name: Secret Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve TruffleHog range
        id: trufflehog_range
        shell: bash
        run: |
          head="${{ github.sha }}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            # Nothing "changed" on a cron run: scan the whole history instead
            # of a zero-length range.
            base=""
          else
            base="${{ github.event.before }}"
            # A new branch reports an all-zero "before", and a force-push can
            # name a commit that no longer exists.
            if [ "$base" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base=""
            fi
          fi

          # An empty or identical base makes TruffleHog fail rather than scan
          # nothing, so fall back to the full history in both cases.
          if [ -z "$base" ] || [ "$base" = "$head" ]; then
            echo "No usable diff range; scanning full history."
            base=""
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ steps.trufflehog_range.outputs.base }}
          head: ${{ steps.trufflehog_range.outputs.head }}
          extra_args: --only-verified

  typescript-type-checking:
    name: TypeScript Type Safety
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The app consumes @proven/engine as built output from its own dist/,
      # so the engine has to be compiled before the app can be typechecked.
      # There is no tsconfig.json at the repository root, so nothing to check
      # there — `npm run typecheck` covers both real projects.
      - name: Build engine
        run: npm run build:engine

      - name: Type check
        run: npm run typecheck

  sql-security:
    name: SQL Security Review
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for SQL injection vulnerabilities in migrations
        run: |
          cd supabase/migrations
          
          # Check for common SQL injection patterns
          echo "Scanning for SQL injection patterns..."
          
          # Look for unparameterized queries
          grep -r "EXECUTE IMMEDIATE\|DYNAMIC SQL\|CONCAT\|||" *.sql | grep -v "^Binary" || true
          
          # Look for missing parameter usage
          grep -r "WHERE.*=" *.sql | head -20

  csp-policy-validation:
    name: CSP Policy Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate CSP in vercel.json
        run: |
          cd app

          # Parsed as JSON, not grepped: the header's "key" and "value" sit on
          # separate lines, so a line-oriented pattern never matches them
          # together and the check silently "finds" nothing.
          csp=$(node -e '
            const cfg = require("./vercel.json");
            const header = (cfg.headers ?? [])
              .flatMap((entry) => entry.headers ?? [])
              .find((h) => h.key === "Content-Security-Policy");
            if (header) process.stdout.write(header.value);
          ')

          if [ -z "$csp" ]; then
            echo "::error::CSP header not found in vercel.json"
            exit 1
          fi

          echo "CSP Policy found:"
          echo "$csp"

          # 'unsafe-inline' on script-src/style-src is a DELIBERATE choice here,
          # not an oversight: this app uses style={{}} extensively throughout
          # its UI, which compiles to an inline `style` HTML attribute that a
          # CSP nonce cannot cover (nonces only apply to actual <script> and
          # <style> elements). A nonce-only policy would block that styling on
          # every page unless every inline style were first migrated to CSS
          # classes — a separate, substantial piece of work, not something to
          # silently require here. See app/SECURITY_INTEGRATION.md.
          #
          # What this check actually verifies is that the real threat this
          # header defends against is still blocked: default-src and
          # object-src must stay locked down, so a script or stylesheet from
          # an attacker-controlled domain still cannot load even with
          # 'unsafe-inline' present for this app's own inline content.
          if echo "$csp" | grep -q "default-src 'none'\|default-src 'self'"; then
            echo "✓ default-src is restrictive"
          else
            echo "::error::default-src is missing or not restrictive"
            exit 1
          fi

          if echo "$csp" | grep -q "object-src 'none'"; then
            echo "✓ object-src is locked down"
          else
            echo "::error::object-src should be 'none'"
            exit 1
          fi

          if echo "$csp" | grep -q "unsafe-inline"; then
            echo "ℹ 'unsafe-inline' present on script-src/style-src — deliberate, see app/SECURITY_INTEGRATION.md"
          fi

  security-headers-validation:
    name: Security Headers Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate security headers in vercel.json
        run: |
          cd app
          
          required_headers=(
            "Strict-Transport-Security"
            "X-Content-Type-Options"
            "X-Frame-Options"
            "X-XSS-Protection"
            "Referrer-Policy"
            "Permissions-Policy"
          )
          
          for header in "${required_headers[@]}"; do
            if grep -q "\"$header\"" vercel.json; then
              echo "✓ $header present"
            else
              echo "✗ $header MISSING"
            fi
          done

  dependency-licensing:
    name: Dependency License Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install license-checker
        run: npm install -g license-checker

      - name: Check app licenses
        run: |
          cd app
          license-checker --onlyunknown --excludePrivatePackages || true
          license-checker --production --csv | grep -E "(GPL|AGPL)" || echo "No GPL/AGPL licenses detected"

  notify-results:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [dependency-scanning, sast-scanning, secret-scanning, typescript-type-checking]
    if: always()
    permissions:
      contents: read

    steps:
      - name: Summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency Scanning: ${{ needs.dependency-scanning.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- SAST: ${{ needs.sast-scanning.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Secret Scanning: ${{ needs.secret-scanning.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Type Checking: ${{ needs.typescript-type-checking.result }}" >> $GITHUB_STEP_SUMMARY
